[[environment]]
family = "spot"
environment = "production"
semantics = "The live exchange. Real balances, real order books, and the only environment where an order moves capital."
carries_real_capital = true
status = "supported"
evidence = "documented"
source = "spot-rest"

[[environment]]
family = "spot"
environment = "demo"
semantics = "Virtual balances on demo-prefixed hosts. Prices and order books are documented as similar to the live exchange, features as always the same, and limits and filters as exactly the same. Balances reset on request."
carries_real_capital = false
host_marker = "demo"
status = "supported"
evidence = "documented"
source = "spot-demo"

[[environment]]
