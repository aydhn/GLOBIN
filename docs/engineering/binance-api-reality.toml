# ---------------------------------------------------------------------------
# GLOBIN Binance API reality registry.
#
# The single place a Binance fact is written down. Parsed by
# `globin.adapters.api_reality`, recomputed by `python -m tools.quality venue`,
# and refreshed -- deliberately from outside the package -- by that gate's
# `refresh` verb.
#
# WHAT THIS IS. A dated record of what Binance's official documentation said, with
# provenance on every row. It is NOT runtime truth about the venue, and it is not a
# copy of the documentation: it points at documents and records what they were
# observed to say.
#
# THE STATUS WORDS. `supported`, `unsupported`, `unknown`, `deprecated`,
# `announced`, `restricted`. The one that matters most is `unknown`, which means
# the documents do not say -- NEVER that a capability is absent. Most non-Spot rows
# are `unknown` because Binance publishes a machine-readable specification for Spot
# and for no other product family; see `docs/research/phase_033_sources.md`, S-11.
#
# EVIDENCE KINDS. `documented`, `inferred`, `observed`. **Nothing here may be
# `observed`**: GLOBIN has never contacted Binance, and a contract test fails if a
# row claims otherwise.
#
# ADDING A ROW IS A DECISION, NOT AN EDIT. Every capability row names a source, and
# a source that is not declared below is refused. Read
# `docs/engineering/BINANCE_API_REALITY.md` before changing anything here.
#
# WHAT FAILS. A repeated identity, a cited source that is not declared, a second
# `latest` schema for one family and environment, an endpoint for a surface
# recorded `unsupported`, an endpoint whose host contradicts its environment, a
# `restricted` row naming no condition, and a FIX endpoint that does not require
# TLS and SNI.
#
# NOTHING GENERATES THIS FILE. It was transcribed once by a script that has served
# its purpose and is not part of the repository.
# ---------------------------------------------------------------------------

schema = 1

[target]
venue = "binance-global"
observed_on = "2026-08-19"
phase = 33


