# What the lock is, what it was resolved for, and what its contents must satisfy.
#
# HAND-WRITTEN. Nothing generates this file, and `python -m tools.quality.lock
# relock` deliberately prints the lines a person must change rather than changing
# them. A declaration a tool rewrites is a mirror of that tool rather than a
# statement anybody made, which is the position `wheel-survey.toml`,
# `mutation-baseline.toml` and `action-pins.toml` each take about themselves.
#
# It exists because a pip-produced lock records almost nothing about the
# environment it is valid for. `pip lock` writes `lock-version`, `created-by` and
# `packages`, and no more — see `docs/research/phase_020_sources.md` entry S-03,
# which reads that from pip's own source because it is documented nowhere. A lock
# with no statement of its own target is a file that agrees with whatever machine
# happens to read it.
#
# Reasoning: `docs/engineering/DEPENDENCY_LOCKING.md` and ADR-0054.

schema = 1

# ---------------------------------------------------------------------------
# What wrote the lock
# ---------------------------------------------------------------------------

[producer]
# Compared against the lock's own `created-by`, which is the bare string "pip"
# with no version attached. The version below therefore cannot be recomputed from
# the lock and is recorded by hand; that seam is real and DEPENDENCY_LOCKING.md
# names it rather than implying the pairing is checked. `drift` observes
# `pip.version` on this host and classifies a change as material, so a moved pip
# is noticed there.
tool = "pip"
version = "26.1.2"

# pip labels both `pip lock` and `pip install -r pylock.toml` EXPERIMENTAL
# (ledger S-02, S-05). Recorded rather than assumed away: it is carried into
# `.globin/lock/lock-manifest.json` so the hedge is visible in the evidence, and
# it is the stated reason this gate recomputes every verdict instead of trusting
# the file, and the reason `bootstrap` keeps a `--from-pins` hand-crank.
experimental = true

# ---------------------------------------------------------------------------
# What it was resolved for
# ---------------------------------------------------------------------------

[target]
# Compared against `runtime-contract.toml` in full. A lock resolved against an
# interpreter this project does not run is not merely stale, it is misleading:
# it would report a coherent, hash-pinned set for a line nothing here uses.
implementation = "CPython"
minor_line = "3.14"
architecture = "AMD64"
platform_tag = "win_amd64"
free_threaded = false

# Where the resolution read from, and where every artefact must be served from.
# The host is checked per artefact: a lock is several hundred URLs, and one of
# them pointing somewhere else is exactly the edit nobody would notice by eye.
index = "https://pypi.org/simple"
artefact_host = "files.pythonhosted.org"

# A bare TOML date, not a string. TOML has a date type, and a quoted date has
# been validated as a date by nothing.
locked = 2026-08-17

# ---------------------------------------------------------------------------
# What the contents must satisfy
# ---------------------------------------------------------------------------

[policy]
# Every artefact carries a digest, or the lock is not doing the one job a lock
# has. `pip install -r pylock.toml` derives its hash checking from these, so this
# is not decoration: an unhashed entry installs whatever the URL serves.
require_hashes = true

# Only algorithms whose digest width the gate knows, so a malformed value is
# caught by shape rather than only by name. `md5` and `sha1` are refused in code
# whatever is written here, so this list cannot be widened into them.
hash_algorithms = ["sha256"]

# The lock is generated with `--only-binary=:all:`, so a package with no wheel
# for the pinned interpreter fails to resolve rather than silently arriving as a
# source distribution that would need a compiler on this host. Setting this true
# would permit one; each would still need a [[gap]] naming an owning phase.
allow_source = false

# ---------------------------------------------------------------------------
# The development lock
# ---------------------------------------------------------------------------

[dev]
path = "pylock.dev.toml"
extra = "dev"

# Every root the lock was resolved from. Compared against `pyproject.toml` IN
# BOTH DIRECTIONS, and the second direction is the one that earns its keep: pip
# records no dependency edges, so a root removed from the project and left here
# is otherwise undetectable offline.
roots = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=4.0",
    "hypothesis>=6.130",
    "pip-audit>=2.9",
]

# ---------------------------------------------------------------------------
# The runtime lock, which Phase 021 created
# ---------------------------------------------------------------------------
#
# This table said `locked = false` from Phase 020 until Phase 021, and its reason
# said the pairing would be enforced rather than remembered. It was: the moment
# `project.dependencies` stopped being empty, LOCK_RUNTIME_UNLOCKED failed until
# this file and `pylock.toml` caught up.
#
# THE RUNTIME LOCK IS CHECKED THE SAME WAY THE DEVELOPMENT ONE IS. Every claim it
# makes about itself — a digest in a permitted algorithm, HTTPS from the declared
# host, PEP 425 tags that serve the pinned interpreter, no unowned source-only
# package — is recomputed from the evidence inside it. A committed lock nobody
# validated would make ADR-0054's title true of one file and false of the other.

[runtime]
path = "pylock.toml"
locked = true
extra = ""
reason = """
Phase 021 declared numpy and pandas in project.dependencies, each with a written
six-question review in dependency-reviews.toml, and produced this lock beside
them in the same commit. Phase 024 added psutil the same way, and its wheel is
the reason `allow_source = false` above still holds: psutil publishes
`psutil-7.2.2-cp37-abi3-win_amd64.whl`, a limited-API wheel that serves the
pinned interpreter without a compiler on this host.

`extra` is empty because runtime dependencies are not an extra: they are
`project.dependencies` itself. The development lock names `dev` because that is
the extra it covers; this one names nothing because there is nothing to name, and
an empty string says that more honestly than omitting the key would.

Phase 025 added ta-lib, and it is the first root here whose resolution pulls
something nobody asked for. Upstream declares `build` — a PEP 517 build frontend —
as an install requirement of a wheel that needs no building, so `build`,
`packaging`, `pyproject_hooks` and `colorama` are in this lock as transitive
packages. They are recorded rather than excluded: a lock exists to say what
actually lands, and `dependency-reviews.toml` explains where they came from.

Phase 026 added four roots and they more than doubled this lock, from eleven
distributions to twenty-six. That was measured before it was chosen — resolved on
this interpreter with `pip install --dry-run --ignore-installed` — and the owner
reaffirmed the choice with the number in front of him.

Fifteen distributions arrive, and only ONE of the four roots is responsible for
eleven of them. `opentelemetry-api` costs `typing-extensions` alone;
`opentelemetry-sdk` adds `opentelemetry-semantic-conventions`;
`prometheus-client` costs nothing at all. The OTLP exporter is what brings
`protobuf`, `requests` and the four distributions `requests` itself needs. The
HTTP variant was named rather than the `opentelemetry-exporter-otlp`
meta-package precisely to avoid `grpcio`, which the gRPC half would have added.

`allow_source = false` still holds, and Phase 025's reasoning is now load-bearing
for a second reason. Two of the new packages are compiled, and neither needs a
compiler here: `charset-normalizer` publishes a native `cp314` wheel, and
`protobuf` publishes `protobuf-7.35.1-cp310-abi3-win_amd64.whl` — a stable-ABI
wheel of exactly the kind psutil's paragraph above describes, serving 3.14
through a tag that does not name it.
"""

# Every root the runtime lock was resolved from. Compared against
# `project.dependencies` in both directions, exactly as [dev] roots is compared
# against the dev extra.
roots = [
    "numpy>=2.5.2",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pandas>=3.0.5",
    "prometheus-client>=0.26.0",
    "psutil>=7.2.2",
    "ta-lib>=0.7.1",
]

# ---------------------------------------------------------------------------
# GLOBIN itself
# ---------------------------------------------------------------------------

[project]
# The distribution this repository builds. Since Phase 021 `scripts/bootstrap.ps1`
# INSTALLS it into `.venv`, because `[project.scripts] globin` only exists once
# something is installed — so `lock installed` now finds a distribution that no
# lock resolved and that is not seeded by `venv` either.
#
# Declared here rather than added to `seeded` below. `seeded` means "the
# environment created this by itself", which is true of `pip` and false of this;
# filing GLOBIN under it would make that sentence wrong in order to save a table.
distribution = "globin"
installed = true

# ---------------------------------------------------------------------------
# What the environment holds that the lock does not
# ---------------------------------------------------------------------------

[environment]
# Distributions `venv` seeds into a fresh environment, which no lock resolved and
# which `lock installed` must therefore not report as unexpected. Named rather
# than inferred: an allowance nobody wrote down is one nobody can review, and
# "ignore anything surprising" is how a comparison stops comparing.
seeded = ["pip"]

# ---------------------------------------------------------------------------
# Gaps
# ---------------------------------------------------------------------------

# One [[gap]] per package with no wheel for the pinned interpreter, each naming
# the phase that answers for it. The bargain is `wheel-survey.toml`'s: a gap is
# not a failure, because a package whose upstream publishes no wheel is not
# something a gate can fix by going red. An UNOWNED gap is a failure. A gap
# recorded against a package that does have a wheel is also a failure, so the
# register cannot accumulate entries nobody needs.
#
# Expected to stay empty while `policy.allow_source` is false: a package with no
# serving wheel fails to resolve at generation rather than reaching this file.
