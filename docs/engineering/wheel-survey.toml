# ---------------------------------------------------------------------------
# Phases 182-183 — Supervised Machine Learning.
# ---------------------------------------------------------------------------

[[library]]
name = "xgboost"
phase = 182
version = "3.4.1"
requires_python = ">=3.12"
wheels = ["xgboost-3.4.1-py3-none-win_amd64.whl"]
verdict = "available"
source = "https://pypi.org/pypi/xgboost/json"
reason = """Gradient boosting, which Phase 182 integrates. It is also the \
library that set `requires-python = ">=3.12"` in Phase 001, per S-11.

NOTE THE TAGS: `py3-none-win_amd64` is platform-specific and interpreter- \
agnostic — a native library loaded through `ctypes` rather than a C extension \
built against a Python ABI. A survey looking for `cp314` would report a gap \
that does not exist, and this entry is why the matcher parses tags rather than \
matching substrings."""

[[library]]
name = "lightgbm"
phase = 182
version = "4.7.0"
requires_python = ">=3.10"
wheels = ["lightgbm-4.7.0-py3-none-win_amd64.whl"]
verdict = "available"
source = "https://pypi.org/pypi/lightgbm/json"
reason = """The alternative gradient boosting implementation Phase 182 weighs \
against XGBoost. Tagged `py3-none-win_amd64` for the same reason XGBoost is.

The wheel is a CPU build. S-12 records that CUDA support requires building from \
source and that the project states CUDA is not supported for Windows users — a \
capability question this survey does not answer and Phases 023-024 do."""

[[library]]
name = "torch"
phase = 183
version = "2.13.0"
requires_python = ">=3.10"
wheels = [
    "torch-2.13.0-cp314-cp314-win_amd64.whl",
    "torch-2.13.0-cp314-cp314t-win_amd64.whl",
]
verdict = "available"
source = "https://pypi.org/pypi/torch/json"
reason = """Neural models, which Phase 183 integrates, and the runtime \
Stable-Baselines3 is built on. Publishes for both the default and the \
free-threaded build of the pinned line.

This is the default PyPI wheel. Which CUDA build installs and performs well on \
this host is recorded as unresolved in the Phase 001 ledger and belongs to \
Phases 023-024; a CUDA variant is served from a separate index and is not \
surveyed here."""

