# ---------------------------------------------------------------------------
# Whether every library the roadmap schedules publishes a wheel for the pinned
# interpreter, on the pinned platform.
#
# NOT A SNAPSHOT. Nothing writes this file, for the reason `action-pins.toml`
# and `dependency-reviews.toml` each give about themselves: a manifest generated
# from the index could only ever agree with the index, which is a mirror rather
# than a check. A person read each project's published metadata and wrote down
# what it said; `tools/quality/wheels/` recomputes the verdict from the recorded
# filenames offline, and `python -m tools.quality.wheels probe` compares the
# record against the live index. Both directions, as everywhere else here.
#
# WHY IT EXISTS. ADR-0051 recorded an inversion: Phase 017 pinned CPython 3.14
# before anything verified the planned stack has wheels for it, which is the
# roadmap's stated order reversed. This file closes that, and it is what could
# change `runtime-contract.toml` — "if the survey finds the planned stack cannot
# run on the pinned line, the contract this phase wrote is what changes".
#
# THIS IS A SURVEY, NOT AN ADOPTION. Nothing here is installed, nothing here
# enters `pyproject.toml`, and nothing here has been through the review process
# in `docs/DEPENDENCY_POLICY.md`. A library appears because the roadmap or its
# Phase 001 source ledger names it, not because it has been chosen. Adoption is
# Phase 021 onwards, one written review at a time.
#
# WHAT IS DELIBERATELY ABSENT, and why, because silence must not read as a gap:
#   - Storage engines. Phase 097 *selects* them. Surveying a candidate would
#     pre-empt the selection that phase exists to make.
#   - Indicator libraries other than TA-Lib. Phase 113 *selects* them; TA-Lib is
#     here because Phases 025 and 114 name it by name.
#   - A Telegram client library. S-17 records an HTTP API, not a package, and no
#     phase schedules a wrapper for it.
#   - Transport libraries. The Binance SDK carries its own; Phases 045-046 build
#     on that rather than choosing separately.
#   - `scipy`, `scikit-learn` and similar. They arrive transitively behind the
#     entries below; nothing in the roadmap schedules them by name.
#
# ADDING AN ENTRY is a claim that the roadmap schedules the library, and `phase`
# is where that claim is checked — it must name a real phase that has not yet
# been delivered. Reasoning: `docs/engineering/WHEEL_AVAILABILITY.md`.
# ---------------------------------------------------------------------------

schema = 1

# ---------------------------------------------------------------------------
# The environment surveyed against.
#
# The first five values are a TRIPWIRE, not a second source of truth. They are
# copied from `runtime-contract.toml`, and `tests/contract/test_wheels_contract.py`
# fails when the two disagree — the rule `SOURCE_OF_TRUTH.md` states for a
# permitted copy. `platform_tag` is the one value this file adds: it is the
# PEP 425 spelling of `architecture` on `system`, which the runtime contract has
# no reason to know.
# ---------------------------------------------------------------------------

[target]
implementation = "CPython"
minor_line = "3.14"
architecture = "AMD64"
platform_tag = "win_amd64"
free_threaded = false
index = "https://pypi.org/pypi/"
surveyed = 2026-08-18

# ---------------------------------------------------------------------------
# Phase 022 — Scientific Stack Installation and Verification. DELIVERED.
#
# `numpy` and `pandas` were surveyed here and are no longer. Phase 021 adopted
# them and Phase 022 verified them, and ADR-0052 is explicit that an entry naming
# a phase that has shipped is "an adoption wearing a survey's clothes" — the
# condition `phase_problems` exists to catch. Leaving them would have passed on a
# technicality, because `DELIVERED_PHASE` is documented as a floor rather than a
# mirror; passing on a technicality is not the same as being true.
#
# THE QUESTION MOVED RATHER THAN CLOSED. This file asks whether a wheel EXISTS for
# the pinned interpreter. Once a library is installed, the answerable question
# becomes whether the thing inside that wheel COMPUTES correctly, which no
# filename can settle. `docs/engineering/stack-contract.toml` now holds those two
# entries and `python -m tools.quality stack` recomputes them from measurement.
# Reasoning: ADR-0058.
#
# Both remain required transitively by several entries below. That is not a reason
# to survey them: a transitive dependency of a surveyed library is covered by that
# library's own wheel, and re-listing it here would restate a claim this file has
# stopped being the source of.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Phase 025 — TA-Lib Native Library Provisioning. DELIVERED.
#
# `ta-lib` was surveyed here and is no longer, for the reason numpy and pandas
# left above: Phase 025 adopted it, and an entry naming a shipped phase is an
# adoption wearing a survey's clothes. `docs/engineering/stack-contract.toml` now
# holds it, and three probes recompute on this host what the survey could only
# claim — that the wheel carries the native C library, that the indicator table is
# complete, and that a moving average is seeded where the convention says.
#
# THE FREE-THREADED GAP LEFT WITH IT, AND THAT IS A CHANGE OF BOOKKEEPING RATHER
# THAN OF FACT. `ta-lib` was the single entry publishing `cp314-cp314` and no
# `cp314t`, so this file now reports that nothing it surveys would block a
# free-threaded build. The gap itself has not closed — it has moved to a library
# this repository has adopted, where ADR-0050's refusal is a property of the
# installed stack rather than of a survey. Read `free_threaded` here as "of the
# libraries not yet adopted", which is all it was ever measuring.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Phases 045-089 — the Binance SDK family.
#
# S-07 records that the connector is a monorepo publishing roughly twenty-five
# independent distributions rather than one package, and names nine of them.
# Those nine are here, each against the phase whose product it serves, plus the
# shared runtime they all require.
#
# EVERY ONE OF THEM CAPS AT `<3.15`. That is the sharpest finding in this file
# and the reason each `requires_python` is recorded verbatim rather than
# summarised: the pinned line satisfies the cap, and the next one would not.
# ---------------------------------------------------------------------------

[[library]]
name = "binance-common"
phase = 45
version = "4.2.0"
requires_python = "<3.15,>=3.10"
wheels = ["binance_common-4.2.0-py3-none-any.whl"]
verdict = "available"
source = "https://pypi.org/pypi/binance-common/json"
reason = """The shared runtime every `binance-sdk-*` distribution requires. It \
is not named in S-07, which lists the product packages; it is here because the \
product packages cannot be installed without it, and a survey of nine packages \
that omitted their common dependency would not have surveyed anything."""

