"""

[[criterion]]
id = "ENV-M-04"
category = "band-closure"
requirement = "The environment band is certified by a matrix the release gate recomputes, not by assertion."
evidence = ["docs/engineering/environment-acceptance.toml", "tools/quality/release/plan.py"]
