conditions, a prose half, and a contract test binding every count to its source
-- the binding being the part that had never existed, which is why the amendment
count in `ROADMAP.md` drifted twice before anybody noticed.
"""

[[criterion]]
id = "ENV-M-02"
category = "band-closure"
requirement = "No document defers a question to a phase that has already delivered."
evidence = ["tests/contract/test_documentation_contract.py"]
command = "python -m pytest -m contract"
blocking = true
status = "PASS"
reason = """
Twenty-three documents are now checked where five were. Nine carried the same
