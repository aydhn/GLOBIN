rather than the parser taught a second spelling.
"""

[[criterion]]
id = "ENV-M-03"
category = "band-closure"
requirement = "The band's documentation agrees with what the band built."
evidence = ["CLAUDE.md", "MEMORY.md", "docs/release/FOUNDATION_ACCEPTANCE.md"]
blocking = false
status = "PASS"
reason = """
Four contradictions were found and closed rather than carried: `CLAUDE.md` said
