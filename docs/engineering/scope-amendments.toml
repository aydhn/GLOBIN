# environment classification model its title names.
#
# The condition it MEETS is the interesting one for once. Every amendment before
# this argued `the two halves need each other` and most of them conceded it; here
# `accepts_credential` is gate 1 of the authentication admission, so a request in a
# simulated environment is refused with no credential having been reached for --
# and no type outside this phase could say so, because a registry of venue facts
# has nowhere to put an environment the venue has never heard of.
# ---------------------------------------------------------------------------

