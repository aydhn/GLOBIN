# What a later phase will find partly built.
#
# The review's most useful output, and the one thing in it that is about the
# future rather than the past. Every row names a phase that has NOT started and
# whose subject already exists in part, together with what is deliberately
# absent -- because a phase told only what exists will rebuild the boundary, and
# a phase told only what is missing will rebuild what is there.
#
# `test_granularity_contract.py` asserts every `phase` here is still `Planned`,
# so a row survives only until its phase ships.
# ---------------------------------------------------------------------------

