# ---------------------------------------------------------------------------
# GLOBIN scope amendment ledger.
#
# The machine-readable half of `docs/engineering/GRANULARITY_REVIEW.md`.
# Compared against `ROADMAP.md` and the decision log, in both directions, by
# `tests/contract/test_granularity_contract.py`.
#
# WHY THIS FILE EXISTS AT ALL. `ROADMAP.md` has carried a prose list of scope
# amendments since Phase 003, and it has drifted twice. It read *seven* while
# listing eight from Phase 024 until Phase 025 repaired it; by Phase 030 it read
# *thirteen* while listing eleven, with the tenth filed below the eleventh. That
# document says so about itself, and names the cause in four words: "Nothing
# tests it." Phase 032 was assigned the granularity review, and a review of a
# count that nothing checks would have been the third instance of the same
# defect rather than an answer to it.
#
# THE TEST BEING SCORED. ADR-0021 never uses the word "condition"; the four-part
# form every later record cites is `ROADMAP.md`'s own restatement of it -- an
# amendment must be able to say *nothing displaced, nothing deferred, no phase
# owns the work, and the two halves need each other*. The four keys below are
# those four, in that order, and `score` is recomputed from them by the contract
# test rather than trusted as written.
#
# VERDICT VOCABULARY -- two words:
#   MET     the amendment's own record claims this condition and the claim holds
#   FAILED  the amendment's own record concedes this condition
#
# There is deliberately no third word. Every one of these was argued in an
# accepted ADR by somebody who had to say plainly which conditions they failed,
# and a "partially" here would be this ledger softening a judgement the record
# already made.
#
# THE FIRST THREE ARE UNSCORED, AND THAT IS NOT AN OMISSION. Amendments one and
# two predate ADR-0021 entirely. The third *is* ADR-0021 -- it created the test
# in the act of being the amendment that needed one -- so scoring it against
# itself would be circular. `scored = false` says so per row.
#
# NOTHING WRITES THIS FILE.
# ---------------------------------------------------------------------------

schema = 1

