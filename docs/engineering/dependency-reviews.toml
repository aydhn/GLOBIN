adopted = "phase-026"
reviewed = 2026-08-17
verdict = "adopted"
reason = """The exposition grammar, and the second interoperability surface the \
Phase 026 telemetry foundation maps onto.

WHAT IT COSTS TRANSITIVELY: NOTHING, AND IT TIES PSUTIL FOR THE CHEAPEST ANSWER \
QUESTION 1 HAS HAD. All three `requires_dist` entries sit behind `extra == \
"twisted"`, `"aiohttp"` and `"django"`; the installed set is one distribution.

LICENCE. A COMPOUND EXPRESSION, RECORDED WHOLE. `Apache-2.0 AND BSD-2-Clause`, \
which is what both `license` and `license_expression` serve. Every component is on \
the allow list, so the compound rule this policy gained in Phase 021 for numpy \
covers it -- and covers it WITHOUT BEING WIDENED, which is worth recording: a rule \
that works the second time unchanged was written at the right level.

MAINTAINED, WITH A WRINKLE THAT CONTRADICTS THE PEDIGREE. Prometheus's own client, \
under the Prometheus GitHub organisation and CNCF governance. But it publishes \
`Development Status :: 4 - Beta` at 0.26.0 after a decade of releases, and its \
version is still `0.x`. That is a stated signal pointing the other way from the \
reputation, and question 3's real test -- could one person stop and nobody notice \
-- is answered no by the organisation rather than by the version string.

RUNTIME, AND FREE. No paid tier, no account, no service. The library formats and \
serves; it contacts nothing outward. ADR-0003 is satisfied.

IT IS ALSO THE FIRST DEPENDENCY THAT CAN BIND A SOCKET, AND NAMING THAT IS WHY \
THIS PARAGRAPH EXISTS. `start_http_server` defaults its address to `0.0.0.0` -- \
every interface, not this machine. GLOBIN passes `127.0.0.1` as a literal and \
exposes no setting that could widen it, the listener is off by default, and an \
architecture tripwire refuses the call anywhere but the one adapter. The library \
also runs its server on daemon threads, which `globin.adapters.watchdog` refuses \
for GLOBIN's own; that deviation is documented rather than inherited in silence.

COULD IT BE WRITTEN INSTEAD? THE FORMAT YES, THE ESCAPING NOT WORTH IT. The text \
exposition format is a few hundred lines, and ADR-0033's precedent for writing a \
harness by hand reaches further here than it did for numpy. What decides against \
it is the failure mode: a label value escaped slightly wrong produces a SCRAPEABLE \
BUT WRONG series -- a plausible number, which `docs/ARCHITECTURE_PRINCIPLES.md` \
treats as worse than a crash.

WHAT BREAKS IF IT DISAPPEARS? Nothing today. One factory in \
`globin.adapters.telemetry_prometheus`, behind a port with a second \
implementation, and absent on every CI run."""

# ---------------------------------------------------------------------------
# Adopted in Phase 029 -- the entry that REVERSES a recorded decision.
#
# ADR-0052 decision 9 says of Phase 018: "No dependency was added -- `urllib.request`
# and `re`, not `packaging`." That was right for what Phase 018 needed, and the
# hand-written matcher it produced is still the only PEP 425 implementation in
# `tools/`. What changed is not the judgement but the question: Phase 029 needs a
# RUNNING GLOBIN to read its own lock, evaluate PEP 508 markers against this
# environment and compare PEP 440 versions -- three things the Phase 018 subset
# refuses BY NAME rather than by omission. ADR-0078 records the reversal.
# ---------------------------------------------------------------------------

[[review]]
name = "packaging"
ecosystem = "pypi"
scope = "runtime"
licence = "Apache-2.0 OR BSD-2-Clause"
licence_source = "https://github.com/pypa/packaging/blob/main/LICENSE"
adopted = "phase-029"
reviewed = 2026-08-18
verdict = "adopted"
reason = """The reference implementation of the packaging specifications this \
repository has been re-deriving by hand: PEP 440 versions, PEP 425 tags, PEP 508 \
markers and requirements, PEP 503 name normalisation, and -- decisively -- PEP 751 \
itself.

WHAT IT COSTS TRANSITIVELY: NOTHING, TWICE OVER, AND BOTH WERE MEASURED. Its \
installed `METADATA` on this host carries ZERO `Requires-Dist` lines: not one \
behind an extra, not one behind a marker, none at all. It is also ALREADY IN BOTH \
LOCKS at 26.3, arriving as a transitive of ta-lib -> build since Phase 025, so \
promoting it to a declared root adds nothing to `pylock.toml` whatsoever. This is \
the only entry in this register whose adoption changes no resolved set at all; \
what changes is that a package GLOBIN was already shipping becomes one it is \
allowed to import.

LICENCE. `Apache-2.0 OR BSD-2-Clause`, read from the project's own LICENSE, which \
is a dual-licence notice stating the software is available under the terms of \
EITHER of LICENSE.APACHE or LICENSE.BSD; both files ship inside the distribution. \
This is the FIRST `OR` EXPRESSION IN THIS REGISTER, and `docs/DEPENDENCY_POLICY.md` \
had already ruled that an `OR` is a choice somebody must make and record rather \
than a lookup. GLOBIN CHOOSES Apache-2.0, for its explicit patent grant; the NOTICE \
obligation that comes with it binds on redistribution, which this repository does \
not do. Both branches were on the allow list already, so the policy needed no \
widening -- only the choice needed writing down.

MAINTAINED. It is PyPA's own, and that is the answer to question 3's real test -- \
could one person stop and nobody notice. This is not a project with a bus factor; \
it is the library `pip`, `build` and effectively every installer already depend on, \
and pip vendors a copy. Version 26.3 is installed here and declares \
`Requires-Python: >=3.9`.

RUNTIME, AND FREE. No paid tier, no account, no service. ADR-0003 is satisfied.

COULD IT BE WRITTEN INSTEAD? IT WAS, AND THE PART THAT MATTERS MOST WOULD HAVE TO \
BE WRITTEN AGAIN. `tools/quality/wheels/plan.py` is the hand-written answer and it \
stays: it decides whether a wheel serves the DECLARED target, must return the same \
verdict on every machine, and is deliberately a subset -- one implementation, one \
minor line, one platform, four specifier operators, everything else refused by \
name. What this phase needs is precisely what that subset refuses. Chiefly, \
`packaging.pylock` is a COMPLETE PEP 751 IMPLEMENTATION -- `Pylock.from_dict` \
validates a lock and raises `PylockUnsupportedVersionError` on a major outside \
`1 <= v < 2`, which is the specification's own MUST, and warns on an unsupported \
minor, which is its SHOULD. Writing a second one by hand would mean this \
repository maintaining a parser for a specification whose reference implementation \
it already ships. Public API since 26.0, `select()` since 26.1 and extended in \
26.3, documented and not marked provisional.

WHAT BREAKS IF IT DISAPPEARS? MORE THAN ANY OTHER ENTRY HERE, AND THAT IS STATED \
RATHER THAN SOFTENED. This is the first runtime dependency with NO absent-safe \
factory: unlike psutil and the four Phase 026 entries, there is no \
`Availability.UNAVAILABLE` path and no degraded answer, because a dependency \
inventory with no version comparison is not a degraded inventory, it is the defect \
Phase 029 exists to fix. The mitigation is containment rather than a fallback -- \
`tests/architecture/test_packaging_discipline.py` confines every import to \
`globin.domain.dependency` and `globin.adapters.dependency`, forbids \
`Marker.evaluate()` with no argument anywhere, and refuses any `packaging` type in \
a ports, application or runtime signature. It is also the one runtime dependency \
PRESENT ON EVERY CI RUN, because pytest declares `packaging>=22` itself; that made \
it safe to import, and `.github/workflows/quality.yml` now pins it explicitly so \
the availability is a declaration rather than a circumstance."""

# ---------------------------------------------------------------------------
# Adopted in Phase 035 — the first dependency adopted for a SECURITY capability.
#
# Every runtime entry above supplies observability, numerics or packaging
# metadata; getting one wrong produces a wrong number or a missing measurement.
# Getting this one wrong produces a request the venue rejects, or — the case that
# matters — one it accepts that GLOBIN did not mean to send. The review is longer
# than the others because question 5 deserved a real answer rather than a
# category, and question 6 has a different shape here than anywhere above.
# ---------------------------------------------------------------------------

[[review]]
name = "cryptography"
ecosystem = "pypi"
scope = "runtime"
licence = "Apache-2.0 OR BSD-3-Clause"
licence_source = "https://github.com/pyca/cryptography/blob/main/LICENSE"
adopted = "phase-035"
reviewed = 2026-08-19
verdict = "adopted"
reason = """Two of the three signature algorithms Binance documents for a SIGNED \
REST request. HMAC-SHA256 is `hmac` and `hashlib` and needs nothing at all; \
RSASSA-PKCS1-v1_5 with SHA-256 and Ed25519 have NO standard-library \
implementation, and `docs/research/phase_035_sources.md` S-04 records the venue \
calling Ed25519 "recommended" and HMAC "deprecated" in the same document. A \
signing layer able to offer only the deprecated algorithm would be one this \
repository chose not to finish.

WHAT IT COSTS TRANSITIVELY: THREE DISTRIBUTIONS, AND THE NUMBER WAS MEASURED \
BEFORE IT WAS ACCEPTED, NOT AFTER. `Requires-Dist` on 50.0.0 is `cffi>=2.0.0` \
behind `platform_python_implementation != "PyPy"`, `typing-extensions>=4.13.2` \
behind `python_full_version < "3.11"` — a marker this project's `requires-python` \
of `>=3.12` cannot satisfy — and `bcrypt` behind an `ssh` extra nobody requests. \
So on this interpreter it is `cffi`, which brings `pycparser`, and nothing else. \
The relock confirmed it exactly: `pylock.toml` went from twenty-six packages to \
twenty-nine and NO existing version moved. Against the fifteen distributions the \
Phase 026 telemetry adoption pulled, this is the second-cheapest runtime adoption \
in this register after `packaging`, which cost nothing because it was already \
there.

LICENCE. `Apache-2.0 OR BSD-3-Clause`, read from the project's own LICENSE, which \
states the software is dual-licensed and ships both LICENSE.APACHE and \
LICENSE.BSD. This is the SECOND `OR` expression in this register and it is \
handled the way `docs/DEPENDENCY_POLICY.md` requires and the way `packaging` \
established: an `OR` is a choice somebody must make and write down, not a lookup. \
GLOBIN CHOOSES Apache-2.0, for its explicit patent grant, which matters more for \
a cryptographic implementation than for a metadata parser. Both branches were \
already on the allow list. The Rust components vendored in the wheel carry their \
own notices and are covered by the same dual licence at the top level.

MAINTAINED. Published by the Python Cryptographic Authority, which is the same \
kind of answer `packaging` gives for PyPA: the question 3 test is whether one \
person could stop and nobody would notice, and this is the library `requests`, \
`urllib3`, `paramiko`, `pyOpenSSL` and effectively every TLS-touching package in \
the ecosystem already depends on. Release cadence is regular and security \
releases are announced with CVE identifiers against a published policy.

RUNTIME, AND FREE. No paid tier, no account, no service, no telemetry. ADR-0003 \
is satisfied.

COULD IT BE WRITTEN INSTEAD? NO, AND THIS IS THE ONE ENTRY WHERE THAT ANSWER IS \
NOT CLOSE. ADR-0033's mutation harness and ADR-0036's shard planner are the \
precedents for writing something rather than taking it, and both are \
deterministic transformations of text whose failures are visible. A signature \
scheme is neither. RSASSA-PKCS1-v1_5 requires DigestInfo DER construction and \
constant-time PKCS#1 padding; Ed25519 requires curve arithmetic over \
GF(2^255-19) with no data-dependent branches. A subtly wrong implementation of \
either does not fail loudly — it produces a signature the venue rejects with \
`-1022` at best, and at worst one that verifies while leaking key material \
through timing. The repository already refuses to hand-roll advisory range \
matching (`pip-audit`) on the weaker argument that getting it wrong fails \
silently; this fails silently AND is the boundary a private key sits behind.

WHAT BREAKS IF IT DISAPPEARS? LESS THAN FOR ANY OTHER RUNTIME ENTRY, BECAUSE IT \
IS ABSENT-SAFE BY CONSTRUCTION. This is the opposite of `packaging`, whose entry \
above records that it has NO absent-safe factory and states the consequence \
plainly. Here the whole import lives inside \
`globin.adapters.signing.asymmetric_signers`, which returns \
`UnavailableAsymmetricSigner` on `ImportError` — the seventh such factory, \
declared as `component.library.cryptography` in \
`docs/engineering/degradation-contract.toml` with necessity `optional`, \
withdrawing exactly `auth.signing.rsa` and `auth.signing.ed25519`. On a host \
without it GLOBIN starts, reports the withdrawal by name, signs with HMAC, and \
REFUSES an RSA or Ed25519 request with `AuthFailure.SIGNER_UNAVAILABLE` rather \
than falling back to a different algorithm. That refusal is the important half: \
a degradation that quietly downgraded Ed25519 to HMAC would be a security \
regression wearing the clothes of resilience.

That absent-safety is not optional politeness. The CI `quality` job installs the \
toolchain with plain `pip` and never builds `.venv`, so `cryptography` is absent \
on every one of those runs — the same condition ADR-0063 records for psutil, and \
the reason `tests/architecture/test_degradation_discipline.py` fails if a factory \
appears without a contract row."""
