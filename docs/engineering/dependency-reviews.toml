# ---------------------------------------------------------------------------
# The verdict on every dependency this repository declares.
#
# NOT A SNAPSHOT, and nothing writes it. Like `action-pins.toml`, this file is
# written by a human who checked each fact, and a contract test compares it
# against the generated inventory in both directions. A dependency the inventory
# finds and this file does not review fails the suite; so does a review here for
# something no longer declared.
#
# WHY IT EXISTS. ADR-0003 says "every proposed dependency needs a licence and
# cost review. Phase 014 defines that process." `docs/DEPENDENCY_POLICY.md` is
# the process; this is its output. Before Phase 014 the six development tools
# were adopted on judgement recorded in commit messages and ADRs, which is not
# nothing but is not reviewable either — you cannot diff a decision that was
# never written down. Everything declared is recorded here, including the six
# that predate the process, because a register with holes in it is a register
# nobody can rely on.
#
# WHAT IS REVIEWED HERE. PyPI distributions. GitHub Actions are a different
# ecosystem with a different question — not "may we depend on this" but "is this
# exact commit the one we verified" — and `action-pins.toml` already answers it.
# Two registers, one ecosystem each, no overlap and nothing to drift.
#
# `licence` IS AN ENGINEERING RECORD, NOT A LEGAL OPINION. It records what the
# project publishes about itself, and `licence_source` says where that was read.
# `docs/DEPENDENCY_POLICY.md` states the allow, deny and unknown policy; nothing
# here claims a legal conclusion.
# ---------------------------------------------------------------------------

schema = 1

# ---------------------------------------------------------------------------
# Adopted before Phase 014, reviewed retrospectively on 2026-08-15.
#
# `reviewed` is the date a human read the licence and the maintenance signals,
# not the date the dependency was adopted; `adopted` records that separately
# where the two differ. Recording the retrospective date honestly is the point —
# claiming these were reviewed in Phase 004 would be inventing a process that
# did not exist.
# ---------------------------------------------------------------------------

[[review]]
name = "hatchling"
ecosystem = "pypi"
scope = "build"
licence = "MIT"
licence_source = "https://github.com/pypa/hatch/blob/master/backend/LICENSE.txt"
adopted = "phase-001"
reviewed = 2026-08-15
verdict = "adopted"
reason = """The build backend named in `[build-system] requires`. PyPA's own, \
and the only entry here that is neither a runtime nor a development dependency: \
it is fetched by a build frontend in an isolated environment and never installed \
alongside GLOBIN.

Reviewed anyway, because "we do not build yet" is a reason to check it cheaply \
rather than a reason to leave it unexamined — Phases 017-032 will build, and a \
build backend adopted without review is a supply chain nobody looked at."""

