[[review]]
name = "pre-commit"
ecosystem = "pypi"
scope = "development"
licence = "MIT"
licence_source = "https://github.com/pre-commit/pre-commit/blob/main/LICENSE"
adopted = "phase-004"
reviewed = 2026-08-15
verdict = "adopted"
reason = """Runs the fast local gate. Note that it manages hook environments of \
its own, so the hook repositories in `.pre-commit-config.yaml` are a supply \
