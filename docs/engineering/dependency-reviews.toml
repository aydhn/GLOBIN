[[review]]
name = "hypothesis"
ecosystem = "pypi"
scope = "development"
licence = "MPL-2.0"
licence_source = "https://github.com/HypothesisWorks/hypothesis/blob/master/hypothesis-python/LICENSE.txt"
adopted = "phase-005"
reviewed = 2026-08-15
