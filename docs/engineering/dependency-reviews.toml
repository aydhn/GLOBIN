[[review]]
name = "pip-audit"
ecosystem = "pypi"
scope = "development"
licence = "Apache-2.0"
licence_source = "https://github.com/pypa/pip-audit/blob/main/LICENSE"
adopted = "phase-014"
reviewed = 2026-08-15
verdict = "adopted"
reason = """The vulnerability audit this phase is required to produce. \
Maintained by PyPA, the same organisation that publishes pip itself, which \
makes it as close to first-party as a Python packaging tool gets.

THE COST WAS THE ARGUMENT AGAINST IT, AND IT IS REAL. Six declared tools \
resolved to almost nothing transitively; adding this one takes the audited set \
to twenty-six distributions, including `requests`, `cachecontrol`, `packaging` \
and `cyclonedx-python-lib`. A supply-chain tool that quadruples the supply chain \
deserves the obvious question.

Three things answered it. It is development-only and never enters the runtime, \
so ADR-0003's zero-budget rule is untouched and no shipped artefact carries any \
of it. It runs in exactly one CI job and in `python -m tools.quality supply`, \
never in `full` and never in the test suite. And the alternative — querying OSV \
directly from repository-native code, in the manner of ADR-0033 — was weighed \
and refused: advisory matching is version-range arithmetic across several \
ecosystems' conventions, and getting it subtly wrong produces a gate that \
reports "no vulnerabilities" while missing them, which is precisely the failure \
this phase exists to prevent. Writing that by hand would trade a dependency for \
a correctness risk in the one place correctness matters most.

It audits a requirements file generated from the inventory rather than the \
ambient environment. See ADR-0044."""

# ---------------------------------------------------------------------------
# Adopted in Phase 021 — the first RUNTIME dependencies this repository has had.
#
# Every entry above is `scope = "development"` or `"build"`, and ADR-0003 exempts
# both. These two are neither. `dependencies = []` was an invariant from Phase
# 001 to Phase 020 and a contract test enforced it; ending that is the work this
# phase was created to do, which is why both records are longer than the ones
# above and why question 4 is answered explicitly rather than by category.
#
# NEITHER IS IMPORTED YET. Phase 022 installs and verifies them. A review is a
# decision to permit, not a claim that something is used, and recording the
# decision in the phase that takes it is what makes it reviewable at all.
# ---------------------------------------------------------------------------

[[review]]
name = "numpy"
ecosystem = "pypi"
scope = "runtime"
licence = "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0"
licence_source = "https://pypi.org/pypi/numpy/json"
adopted = "phase-021"
reviewed = 2026-08-16
verdict = "adopted"
reason = """The numerical foundation of everything Phases 022 onwards schedule, \
and a transitive requirement of four other entries in \
`docs/engineering/wheel-survey.toml` — pandas, xgboost, lightgbm and torch. A \
survey that omitted it would be surveying a stack that cannot be installed.

LICENCE. It publishes an SPDX EXPRESSION rather than an identifier, and the \
expression is recorded whole: its own code is BSD-3-Clause and four vendored \
components carry 0BSD, MIT, Zlib and CC0-1.0. `docs/DEPENDENCY_POLICY.md` gained \
the last three and a rule for compound expressions in this phase, because the \
alternative was to record `BSD-3-Clause` and have the register say something the \
project does not. Read from the JSON API rather than from a summary site, and \
the field is `license_expression` rather than the deprecated `license`.

MAINTAINED. NumFOCUS-sponsored, with a published release cadence and a steering \
council rather than a single maintainer. It is the least likely dependency in \
the entire planned stack to be abandoned.

RUNTIME, AND THAT IS THE POINT. This is the first time question 4 has had a \
non-obvious answer here. It runs in the runtime, ADR-0003's zero-budget rule \
binds absolutely, and it is satisfied: BSD-3-Clause is free, there is no paid \
tier, no account, no telemetry and no service behind it.

COULD IT BE WRITTEN INSTEAD? No, and this is the clearest `no` the six questions \
have produced. Numerical correctness at array scale is decades of accumulated \
edge cases in floating-point behaviour, and ADR-0033's argument for writing a \
mutation harness by hand does not transfer: a hand-written array library that is \
subtly wrong produces plausible numbers, which is the failure mode this project \
can least afford.

WHAT BREAKS IF IT DISAPPEARS? Everything from Phase 022 onwards. It is the least \
reversible dependency GLOBIN will take, which is exactly why it is reviewed \
before anything imports it rather than after."""

[[review]]
name = "pandas"
ecosystem = "pypi"
scope = "runtime"
licence = "BSD-3-Clause"
licence_source = "https://github.com/pandas-dev/pandas/blob/main/LICENSE"
adopted = "phase-021"
reviewed = 2026-08-16
verdict = "adopted"
reason = """The dataframe half of the stack Phase 022 installs. Market data \
arrives as labelled, time-indexed, heterogeneously-typed tables, and that is the \
one shape this library exists for.

LICENCE. A single identifier, unlike numpy: BSD-3-Clause, stated in the \
project's own LICENSE file and corroborated by its `License :: OSI Approved :: \
BSD License` classifier. Read from the repository text rather than from the \
classifier, because a classifier names a family and the file names the licence.

MAINTAINED. NumFOCUS-sponsored, with a large contributor base and a published \
release cadence. Question 3's real test — could one person stop and nobody \
notice — is answered no.

RUNTIME, AND FREE. As above: no paid tier, no account, no service. ADR-0003 is \
satisfied.

COULD IT BE WRITTEN INSTEAD? Partly, and that is why this record is shorter than \
numpy's rather than longer. A narrow time-series container over `Decimal` is a \
few hundred lines, and Phases 010-012 already built exact arithmetic and \
serialization by hand for precisely that reason. What is NOT reasonable to write \
is the rest of it: timezone-aware resampling, joins on non-unique indexes, and \
the missing-data semantics that decide whether a gap in a candle series \
propagates or is silently filled. Getting those subtly wrong produces backtests \
that look right, which `docs/ARCHITECTURE_PRINCIPLES.md` treats as worse than a \
crash.

THE PRICE IS THAT IT PULLS numpy, AND numpy WAS ADOPTED ANYWAY. It would have \
been the deciding cost otherwise; it is not one here.

WHAT BREAKS IF IT DISAPPEARS? Data handling from Phase 022 onwards. More \
reversible than numpy — the container could be replaced with a narrower one \
written here — but not cheaply, and not without re-answering the semantics \
questions above."""

# ---------------------------------------------------------------------------
# Adopted in Phase 024 — the first runtime dependency this repository IMPORTS.
#
# The two entries above are declared, locked and deliberately never imported;
# `tests/architecture/test_stack_discipline.py` fails if that changes. This one is
# imported, by exactly one adapter, and that difference is the reason it gets its
# own section rather than being appended to theirs.
# ---------------------------------------------------------------------------

[[review]]
name = "psutil"
ecosystem = "pypi"
scope = "runtime"
licence = "BSD-3-Clause"
licence_source = "https://github.com/giampaolo/psutil/blob/master/LICENSE"
adopted = "phase-024"
reviewed = 2026-08-16
verdict = "adopted"
reason = """The process and host resource half of the Phase 024 health snapshot. \
GLOBIN must be able to say what it is consuming — resident memory, cumulative \
CPU time, thread and handle counts, and how much of the host's memory is left — \
without leaving the machine.

WHAT IT COSTS TRANSITIVELY: NOTHING, AND THAT IS MEASURED RATHER THAN CLAIMED. \
Every entry in psutil's `requires_dist` sits behind `extra == "dev"` or `extra \
== "test"`; the installed set is one distribution. This is the cheapest answer \
question 1 has had in this register, and it is the answer that decided the \
review — the alternative below is not obviously worse on any other axis.

LICENCE. BSD-3-Clause, read from the project's own LICENSE file rather than from \
a summary site, and corroborated by the `license_expression` PyPI serves. A \
single identifier, like pandas and unlike numpy.

MAINTAINED. Fifteen years old, and the release record is the evidence rather \
than the reputation: 7.0.0 in February 2025, then 7.1.0, 7.1.1, 7.1.2, 7.1.3, \
7.2.0, 7.2.1 and 7.2.2 through January 2026. Question 3's real test — could one \
person stop and nobody notice — is the uncomfortable one here, because this \
project has had a single dominant maintainer for most of its life. The mitigation \
is not that the risk is absent; it is that the surface GLOBIN uses is small, \
stable and replaceable, which is what the next answer is about.

RUNTIME, AND FREE. No paid tier, no account, no service. ADR-0003 is satisfied.

COULD IT BE WRITTEN INSTEAD? YES, AND THIS IS THE CLOSEST CALL IN THE REGISTER. \
The fields Phase 024 reads are available from three documented Win32 entry \
points — `GlobalMemoryStatusEx`, `K32GetProcessMemoryInfo` and \
`GetProcessHandleCount` — reachable through `ctypes`, which is already in \
`docs/architecture/dependency-rules.toml`'s I/O-capable list. That route was \
costed and put to the owner as an explicit choice against this one, and the owner \
chose the dependency. What it buys is that the structure-layout and error \
handling for those calls is somebody else's tested problem rather than this \
repository's untested one, and a wrong `ctypes.Structure` field width does not \
raise — it returns a plausible number, which is the failure mode \
`docs/ARCHITECTURE_PRINCIPLES.md` treats as worse than a crash.

WHAT BREAKS IF IT DISAPPEARS? Less than any other runtime entry here, and that \
was designed in rather than discovered. `globin.adapters.health` reaches psutil \
through one factory, `system_process_probe()`, behind the `ProcessProbe` port. \
With psutil absent the probe records `Availability.UNAVAILABLE` and the snapshot \
is still produced — which is not a hypothetical: it is what happens in the CI \
`quality` job on every run. Replacing the library means replacing one adapter \
against a port that already has a second implementation."""

# ---------------------------------------------------------------------------
# Adopted in Phase 025 — the entry whose native half is the reason the phase
# exists.
#
# Every other runtime entry here is pure Python or ships a self-contained
# extension. This one wraps a separate C library that has historically had to be
# installed by hand on Windows, and `docs/engineering/wheel-survey.toml` filed
# "whether the wheel carries it" against Phase 025 by name rather than reading it
# off a filename. The review answers the six questions; the measurement that the
# wheel actually carries the library is `docs/engineering/stack-contract.toml`.
# ---------------------------------------------------------------------------

[[review]]
name = "ta-lib"
ecosystem = "pypi"
scope = "runtime"
licence = "BSD-2-Clause"
licence_source = "https://github.com/ta-lib/ta-lib-python/blob/master/LICENSE"
adopted = "phase-025"
reviewed = 2026-08-17
verdict = "adopted"
reason = """The indicator wrapper Phases 025 and 114 name. Phase 113 selects the \
indicator set; Phase 114 wraps this behind a typed interface with a pure-Python \
fallback. Phase 025 provisions it and proves the native library is here.

WHAT IT COSTS TRANSITIVELY, AND ONE ENTRY IS A SURPRISE. `requires_dist` is two \
names: `numpy`, which this repository already declares, and `build` — a PEP 517 \
build FRONTEND, appearing as an install-time requirement of a wheel that needs no \
building. It is not conditioned on an extra, so a resolver takes it, and with it \
`packaging`, `pyproject_hooks` and — because `build` requires it on Windows — \
`colorama`. That is four distributions arriving to satisfy a declaration that \
looks like a packaging mistake upstream rather than a real dependency, and the \
count is read from `pylock.toml` after resolving rather than from `requires_dist` \
before it. It is recorded here rather than worked around: the lock is the place \
that says what actually lands, and a dependency nobody expected is exactly what \
this register exists to make visible.

LICENCE, AND IT IS NOT MACHINE-READABLE. BSD-2-Clause, counted by reading the \
clauses in the project's own LICENSE file. PyPI serves `license: null` and \
`license_expression: null`, and the only metadata signal is the classifier \
`License :: OSI Approved :: BSD License`, which does not distinguish two clauses \
from three. Unlike pandas and psutil, no automated check could have established \
this identifier — it came from the file.

MAINTAINED, ON THE EVIDENCE THAT MATTERS HERE. 0.7.1 published 2026-07-16, and \
the release line 0.6.5 through 0.7.1 is present on the index. The relevant fact is \
narrower than activity: binary wheels carrying the C library began at 0.6.5, which \
is what turned "provision a native library on Windows" from a documented manual \
procedure into an install. The wrapper is the long-standing one the ecosystem \
uses, and the C library beneath it has been stable for years.

RUNTIME, AND FREE. No paid tier, no account, no service. ADR-0003 is satisfied.

COULD IT BE WRITTEN INSTEAD? THE WRAPPER, YES; THE LIBRARY, NO — AND THAT IS THE \
POINT. TA-Lib is roughly one hundred and fifty indicators whose exact conventions \
— seeding, warm-up length, which average an indicator uses internally — are the \
thing being depended on, not the arithmetic. Reimplementing them would mean \
reimplementing those conventions and then discovering the differences against live \
data. Phase 114 nonetheless schedules a pure-Python fallback path, which is the \
honest hedge: not "this cannot be replaced" but "replacing it is a project, and \
one phase already owns it".

WHAT BREAKS IF IT DISAPPEARS? Nothing today, and Phase 114 by design. Nothing \
under `src/globin` imports it — `tests/architecture/test_stack_discipline.py` \
derives its guarded set from the stack contract, so adding it here forbids the \
import until a phase removes the tripwire deliberately. The fallback if a future \
interpreter has no wheel is documented rather than assumed: build from source, \
which requires the C library installed first, which is the manual Windows \
procedure this phase exists to avoid needing."""

# ---------------------------------------------------------------------------
# Adopted in Phase 026, the first entries taken for a VOCABULARY rather than a
# capability.
#
# Every runtime entry above supplies something GLOBIN could in principle compute:
# an array, a frame, a process counter, an indicator. These supply agreed NAMES
# and SHAPES -- instrument kinds, aggregation semantics, an exposition grammar --
# and a private spelling of those is worth nothing, because the entire value is
# that somebody else's tool reads them without being taught.
#
# All four are absent on every CI run, like psutil, and each is reached through
# one adapter. They are psutil's kind rather than a new one.
# ---------------------------------------------------------------------------

[[review]]
name = "opentelemetry-api"
ecosystem = "pypi"
scope = "runtime"
licence = "Apache-2.0"
licence_source = "https://github.com/open-telemetry/opentelemetry-python/blob/main/LICENSE"
adopted = "phase-026"
reviewed = 2026-08-17
verdict = "adopted"
reason = """The instrument vocabulary the Phase 026 telemetry foundation maps \
onto. GLOBIN's canonical metric names live in its own `globin.*` namespace; this \
package is what lets them reach a reader who has never seen this repository.

WHAT IT COSTS TRANSITIVELY: ONE DISTRIBUTION, AND THE COUNT MOVED RECENTLY ENOUGH \
TO BE A TRAP. `typing-extensions` and nothing else. Through 1.41.0 this package \
also required `importlib-metadata<8.8.0,>=6.0` unconditionally; that was dropped \
at 1.42.0, in the same release that raised `requires_python` from >=3.9 to >=3.10. \
A review written from memory or from a summary would have declared a dependency \
this repository does not take. Measured on this interpreter with `pip install \
--dry-run --ignore-installed`, not read off documentation.

LICENCE. Apache-2.0, a single identifier in `license_expression`, corroborated by \
the project's own LICENSE. On the allow list.

MAINTAINED. A CNCF project with a published release train and no single dominant \
maintainer, which is the axis psutil's review had to concede. The API/SDK split is \
itself the maintenance signal: `-api` is versioned for stability precisely so that \
instrumentation does not move when the machinery does.

RUNTIME, AND FREE. No paid tier, no account, no service. The `-api` package alone \
exports nothing over a network and configures no exporter -- its default provider \
is a documented no-op. ADR-0003 is satisfied.

COULD IT BE WRITTEN INSTEAD? THE MECHANISM YES, THE VOCABULARY NO, AND THAT \
DISTINCTION IS THE WHOLE REVIEW. A counter and a histogram are an afternoon, and \
`docs/engineering/GPU_BENEFIT.md` shows this repository will write a harness by \
hand when the harness is the point. What cannot usefully be reinvented is the \
agreement about what a counter MEANS -- monotonicity, temporality, how a bucket \
boundary is read -- because a private agreement is one nobody else's tool honours.

WHAT BREAKS IF IT DISAPPEARS? Nothing today, and that is observed rather than \
designed for. `globin.adapters.telemetry_otel` reaches it through one factory \
behind a port that already has a second implementation; absent, the factory \
records unavailability and the local snapshot is still produced. That is what \
happens in the CI `quality` job on every run, which installs neither it nor the \
SDK."""

[[review]]
name = "opentelemetry-sdk"
ecosystem = "pypi"
scope = "runtime"
licence = "Apache-2.0"
licence_source = "https://github.com/open-telemetry/opentelemetry-python/blob/main/LICENSE"
adopted = "phase-026"
reviewed = 2026-08-17
verdict = "adopted"
reason = """The machinery behind the vocabulary. The API alone is a no-op, which \
is exactly what keeps a default bootstrap silent -- but it also means the mapping \
in `globin.adapters.telemetry_otel` could never be exercised end to end, and an \
untested mapping between two naming schemes is where a wrong series comes from.

WHAT IT COSTS TRANSITIVELY: ONE DISTRIBUTION BEYOND THE API. \
`opentelemetry-semantic-conventions`, which arrives at version 0.65b0 -- and the \
`b` is a beta marker rather than a typo. That is recorded rather than smoothed \
over, because it is precisely the hazard the Phase 026 brief named: an \
experimental convention must not become this repository's permanent contract. \
Nothing under `src/globin` imports it. GLOBIN's names are its own, and the mapping \
to any convention is a declared table rather than a derivation.

LICENCE. Apache-2.0, same project, same LICENSE file as the API.

MAINTAINED. The same release train, versioned in lockstep with the API.

RUNTIME, AND FREE. No paid tier, no account, no service. The SDK opens nothing on \
its own: a reader must be registered before anything is collected, and a default \
GLOBIN registers none.

COULD IT BE WRITTEN INSTEAD? YES, AND THAT MAKES THIS THE WEAKEST OF THE FOUR \
ENTRIES ADDED HERE. An in-memory double over GLOBIN's own snapshot would exercise \
the mapping without this package. What it buys is that the thing under test is the \
REAL aggregation, so a mapping that is wrong about temporality fails here rather \
than agreeing with a double that shares the misunderstanding.

WHAT BREAKS IF IT DISAPPEARS? Nothing today. The same one-factory shape as the \
API, and the CI `quality` job demonstrates it on every run."""

[[review]]
name = "opentelemetry-exporter-otlp-proto-http"
ecosystem = "pypi"
scope = "runtime"
licence = "Apache-2.0"
licence_source = "https://github.com/open-telemetry/opentelemetry-python/blob/main/LICENSE"
adopted = "phase-026"
reviewed = 2026-08-17
verdict = "adopted"
reason = """The only path by which a GLOBIN metric can leave this machine, and it \
is off by default and opens nothing unless configured.

WHAT IT COSTS TRANSITIVELY: THE LARGEST ANSWER THIS REGISTER HAS PRODUCED, AND THE \
OWNER WAS GIVEN THE NUMBER BEFORE CHOOSING. Eleven further distributions -- \
`opentelemetry-proto`, `opentelemetry-exporter-otlp-proto-common`, \
`googleapis-common-protos`, `protobuf`, `requests`, `urllib3`, `certifi`, `idna`, \
`charset-normalizer`, alongside the API and SDK above. `pylock.toml` goes from \
eleven distributions to twenty-six. Two are compiled: `charset-normalizer` ships a \
native `cp314` wheel and `protobuf` a `cp310-abi3` one, which serves 3.14 through \
the stable ABI. Resolved on this interpreter rather than inferred from filenames.

THE HTTP VARIANT WAS CHOSEN OVER THE GRPC ONE DELIBERATELY. \
`opentelemetry-exporter-otlp` is a meta-package pulling both, and the gRPC half \
adds `grpcio`, a large compiled distribution whose wheel availability is a \
per-release question on a new interpreter line. The HTTP variant avoids it \
entirely, which is why this entry names the variant and not the meta-package.

LICENCE. Apache-2.0. Its transitive set adds Apache-2.0, BSD-3-Clause, MPL-2.0 \
and MIT, all on the allow list. `certifi` is called out separately because it is \
CONTENT rather than code: a CA-certificate bundle whose value is data somebody \
must keep current, and it will appear in the SBOM as such.

MAINTAINED. The same release train, versioned in lockstep.

RUNTIME, AND FREE. OTLP is an open protocol with free collectors, so ADR-0003's \
zero-budget rule -- which is about paid services -- is satisfied. No collector is \
configured, named or required by GLOBIN.

COULD IT BE WRITTEN INSTEAD? THE WIRE FORMAT, NOT REASONABLY. OTLP over HTTP is \
protobuf, and hand-rolling a protobuf encoder to avoid a protobuf dependency is a \
category error rather than a trade.

WHAT BREAKS IF IT DISAPPEARS? Nothing, and more completely than for any other \
entry here. Export is opt-in and default-off, so an ordinary GLOBIN never \
constructs this exporter at all."""

[[review]]
name = "prometheus-client"
ecosystem = "pypi"
scope = "runtime"
