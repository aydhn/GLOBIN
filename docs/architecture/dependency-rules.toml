# ---------------------------------------------------------------------------
# GLOBIN architecture dependency contract.
#
# This file is the CANONICAL statement of which layer may import which.
#
#   docs/architecture/README.md          explains the layers in prose
#   tests/architecture/                  enforces this file against the real
#     test_architecture_contract.py      import graph
#   src/globin/domain/architecture.py    models the rules as pure types
#
# None of those restates the matrix below. A second copy of a rule is drift
# rather than a tripwire unless a test compares the copies and fails when they
# diverge — see docs/engineering/SOURCE_OF_TRUTH.md. The one deliberate copy is
# the `Layer` enumeration in the domain module, and a test compares it against
# the layer names declared here.
#
# Editing a `may_import` list changes what the codebase is permitted to do.
# Do it in the phase that decided it, and record the decision as an ADR.
# ---------------------------------------------------------------------------

[meta]
root_package = "globin"
established_in_phase = 3

# ---------------------------------------------------------------------------
# Modules that sit above the layer stack.
#
# These hold project identity, roadmap policy and the error taxonomy. Every
# layer may read them, because a policy constant is not a dependency on a layer,
# and an exception class every layer is allowed to raise cannot live inside one
# of them without inverting the direction. They must import no layer themselves,
# which keeps the relationship one-way and is asserted separately.
#
# `globin.errors` joined this table in Phase 005; see ADR-0022 for why the
# taxonomy sits above the stack rather than in the domain layer.
# ---------------------------------------------------------------------------
[shared]
modules = ["globin.errors", "globin.project_contract", "globin.roadmap"]

# ---------------------------------------------------------------------------
# Standard library packages that give a module the ability to reach outside its
# own process: the filesystem, the network, the environment, other processes,
# other threads, or the logging subsystem.
#
# Importing one of these is the observable signal that a layer has grown an I/O
# capability. It is a proxy rather than a proof — a layer could still be handed
# an open socket — but it is a deterministic one, and it catches the way the
# boundary is realistically eroded: someone reaches for `os` or `pathlib`
# because it was convenient.
# ---------------------------------------------------------------------------
[io]
capable_modules = [
    "asyncio",
    "concurrent",
    "ctypes",
    # `faulthandler` joined this table in Phase 023; see ADR-0060. It writes a
    # native traceback to a file descriptor it is handed and keeps writing to it
    # from a signal context, which is I/O by any reading — and, unusually, I/O
    # that continues after the interpreter has stopped being able to run Python.
    # An inner layer reaching for it would be an inner layer holding an open file.
    "faulthandler",
    "ftplib",
    "http",
    "imaplib",
    "io",
    "logging",
    "mmap",
    "multiprocessing",
    "os",
    "pathlib",
    "pickle",
    "poplib",
    "selectors",
    "shutil",
    "signal",
    "smtplib",
    "socket",
    "socketserver",
    "sqlite3",
    "ssl",
    "subprocess",
    "sys",
    "telnetlib",
    "tempfile",
    "threading",
    # `time` joined this table in Phase 009; see ADR-0034. It is listed and
    # `datetime` is not, which is the asymmetry a reader will want explained.
    # `time` is entirely a clock-and-sleep module: it holds no value type, so
    # every reason to import it in an inner layer is a reason to read the host.
    # `datetime` is mostly a calendar-and-value module, and banning it would make
    # ENGINEERING_CONTRACT.md invariant 25 unimplementable — "timezone-naive
    # datetimes must not cross a domain boundary" presupposes that aware ones do,
    # so the domain must be able to name the type. The narrower rule that closes
    # that gap — no clock is *read* outside the adapters layer — is enforced by
    # tests/architecture/test_clock_discipline.py rather than by this list.
    "time",
    "tomllib",
    # `tracemalloc` joined this table in Phase 024; see ADR-0063. It is the one
    # entry here that reaches *inward* rather than outward, and it earns its place
    # for a different reason from the rest: starting it mutates interpreter-global
    # state that changes the cost of every allocation in the process, for every
    # thread, until somebody stops it. `ENGINEERING_CONTRACT.md` invariant 5
    # forbids hidden global state, and an inner layer able to switch a profiler on
    # would be exactly that.
    "tracemalloc",
    "urllib",
    "webbrowser",
    "xmlrpc",
    # `zipfile` joined this table in Phase 024; see ADR-0063. It opens a path and
    # writes to it, which is I/O by any reading — it merely happens to be spelled
    # as a container format rather than as a file operation, which is precisely how
    # it would have got past a reviewer looking for `open`.
    "zipfile",
]

# ---------------------------------------------------------------------------
# The layers, innermost first.
#
#   may_import       other layers this one may depend on, by layer name
#   may_perform_io   whether the layer may import an I/O-capable module
#
# The permitted direction is inward only. Nothing in this file grants an inner
# layer knowledge of an outer one, and that absence is the whole contract:
# domain must remain describable without mentioning Binance, HTTP, Windows or
# any storage engine.
# ---------------------------------------------------------------------------

[layers.domain]
package = "globin.domain"
responsibility = "Pure concepts, values and rules. Knows nothing outside itself."
may_import = []
may_perform_io = false

[layers.ports]
package = "globin.ports"
responsibility = "Abstract contracts for talking to the outside world."
may_import = ["domain"]
may_perform_io = false

[layers.application]
package = "globin.application"
responsibility = "Use cases that coordinate domain objects through ports."
may_import = ["domain", "ports"]
may_perform_io = false

[layers.adapters]
package = "globin.adapters"
responsibility = "Concrete implementations of ports. The only layer that touches the world."
may_import = ["domain", "ports", "application"]
may_perform_io = true

[layers.runtime]
package = "globin.runtime"
responsibility = "The composition root. Builds objects and wires dependencies."
may_import = ["domain", "ports", "application", "adapters"]
may_perform_io = true
