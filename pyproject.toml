# ---------------------------------------------------------------------------
# GLOBIN project metadata.
#
# Phase 1 scope note: this file deliberately declares ZERO runtime dependencies.
# That is not an oversight — it is an enforced invariant.
# `tests/contract/test_packaging_contract.py` asserts `project.dependencies == []`,
# so any future phase that adds a runtime dependency must do so consciously and
# update the contract test. (The path was corrected in Phase 016: the file moved
# into `tests/contract/` when Phase 005 introduced the taxonomy directories, and
# this comment kept naming the old location.)
# Dependency management and lockfiles are the subject of Phases 17-32.
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "globin"
description = "Engineering foundation for GLOBIN, a local autonomous Binance Global research and trading system."
readme = "README.md"
# Floor chosen from evidence, not preference. The strictest constraint among
# the libraries scheduled for later phases is XGBoost (>=3.12); PyTorch is
# >=3.10, Gymnasium/Stable-Baselines3 >=3.10, Optuna >=3.9. Choosing 3.12 now
# avoids a breaking bump when Phase 177+ introduces XGBoost. See
# docs/research/phase_001_sources.md.
requires-python = ">=3.12"
dynamic = ["version"]
keywords = ["binance", "trading", "research", "backtesting", "quantitative"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Private :: Do Not Upload",
    "Topic :: Office/Business :: Financial :: Investment",
]
# The first runtime dependencies, introduced in Phase 021.
#
# `dependencies = []` was an invariant from Phase 001 to Phase 020, and ending it
# is the work this phase was created to do rather than a convenience taken along
# the way. Each entry carries a written six-question review in
# `docs/engineering/dependency-reviews.toml`; neither was adopted on judgement.
#
# LOWER BOUNDS, NOT PINS. The bound is the version `docs/engineering/wheel-survey.toml`
# actually surveyed, and `pylock.toml` beside this file pins what gets installed.
# Declaring an exact version here would put the pin in two places and give the
# lock nothing to be the source of.
#
# THE LOCK IS NOT OPTIONAL. `LOCK_RUNTIME_UNLOCKED` fails the moment this list is
# non-empty while `docs/engineering/lock-policy.toml` says the runtime is
# unlocked, so these two lines and `pylock.toml` arrived in one commit and cannot
# be separated afterwards.
#
# Phase 022 installs and verifies them. Nothing in `src/globin` imports either
# yet, and this phase makes no claim about their correctness — declaring,
# reviewing and locking is one job, and confirming a library computes what it
# says is another.
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
]

# The one console entry point, introduced in Phase 021.
#
# It delegates and holds nothing: the wrapper a build backend generates calls
# `main()` and exits on what it returns, so `globin` and `python -m globin` reach
# the same function and cannot answer differently. A contract test asserts that
# rather than trusting it.
#
# It exists only once the project is INSTALLED, which is what `scripts/bootstrap.ps1`
# now does. Running from the source tree with `python -m globin` works without an
# install; the console script does not, and `globin doctor` says so rather than
# leaving a reader to guess why the command is not found.
[project.scripts]
globin = "globin.runtime.cli:main"

[project.optional-dependencies]
# Free/open-source development toolchain only (ADR-0003).
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Added in Phase 004 with the hook gate it runs. These are lower bounds, not
    # a lockfile; the CI workflow pins exact versions so that the hook, the local
    # gate and CI cannot return different verdicts. Real dependency resolution
    # and locking is Phase 020.
    "pre-commit>=4.0",
    # Added in Phase 005 for the property level. MPL-2.0, free, and a development
    # tool rather than a runtime one, so ADR-0003 permits it; `dependencies`
    # above stays empty and a contract test still asserts that. Its only runtime
    # requirement is `sortedcontainers`, which is why it is cheap enough to be
    # worth the sixth entry in this list. See ADR-0023.
    "hypothesis>=6.130",
    # Added in Phase 014, and the first dependency this repository adopted
    # THROUGH a review process rather than before there was one. PyPA's own tool,
    # Apache-2.0, development-only.
    #
    # It is by far the most expensive entry here: six declared packages resolve
    # to twenty-six distributions once its transitive tree is counted, against a
    # toolchain that had none worth mentioning. That cost was weighed and
    # accepted, and the record is in `docs/engineering/dependency-reviews.toml`
    # rather than in this comment — writing the reasoning down in a reviewable
    # file is the process Phase 014 exists to build.
    #
    # It runs in exactly one CI job and in `python -m tools.quality supply`. It
    # is NOT in `full`, because it reaches the network and `full` must work on an
    # aeroplane. See ADR-0044.
    "pip-audit>=2.9",
]

[tool.hatch.version]
# Single source of truth for the version is the package itself.
path = "src/globin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/globin"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# `pythonpath` lets the whole suite run against the source tree with no build
# and no install step. Phase 1 intentionally performs no packaging build; that
# verification belongs to Phases 17-32.
#
# `"."` is what makes `tests` and `tools` importable by name. Phase 004 turned
# `tests/` into a package so that test modules get stable, fully-qualified names
# and shared helpers are imported explicitly from `tests.support`. Declaring the
# root here is the alternative to relying on pytest inserting a directory into
# `sys.path` as a side effect of where a test happens to live.
pythonpath = ["src", "."]
# Strictness is declared as ini options, NOT as `--strict-markers` in `addopts`.
#
# That distinction is load-bearing and was found by test, not by reading: with
# the flag in `addopts`, pytest 9 downgrades an unregistered marker to a
# `PytestUnknownMarkWarning` and the run passes. The repository had carried that
# configuration since Phase 001, so the marker guard it believed it had was not
# in force. As ini options both are enforced at collection, which
# `tests/contract/test_quality_contract.py` now proves against a throwaway
# project built from these very settings.
strict_markers = true
strict_config = true
addopts = [
    # `importlib` imports test modules without mutating `sys.path` at all. With
    # the package layout above it also means two test modules may share a
    # basename in different taxonomy directories without colliding. There is no
    # ini key for this; pytest exposes it as a command-line option only.
    "--import-mode=importlib",
    "-ra",
]
filterwarnings = ["error"]
# Discovery is stated rather than inherited. These are pytest's defaults today,
# but a default is a decision someone else gets to change; naming them means a
# future pytest cannot silently start or stop collecting something.
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# An xfail that unexpectedly passes is a failure, not a curiosity. Without this
# a fixed bug leaves its test permanently green-but-lying.
xfail_strict = true
# JUnit XML, for the evidence gate. All four keys are INERT unless a run passes
# `--junitxml`, so no existing gate changes what it does by their presence —
# which is how ADR-0032 condition 5 survives an edit to shared configuration.
#
# `junit_logging = "no"` is the load-bearing one. It keeps captured stdout,
# stderr and log records OUT of the XML. A test that printed an environment
# variable while diagnosing something would otherwise put it in a file CI
# uploads as an artifact, and scrubbing afterwards is strictly worse than not
# capturing: the redaction check in `tools/quality/evidence` is a backstop, not
# the mechanism.
#
# `junit_duration_report = "total"` is pytest's own default, restated rather
# than inherited so the choice is visible. "total" is setup + call + teardown,
# which is the number that answers "how long did this test cost the suite" —
# the question the evidence is for. "call" would hide an expensive fixture.
junit_family = "xunit2"
junit_suite_name = "globin"
junit_logging = "no"
junit_duration_report = "total"

# The taxonomy. The first six are levels and are mutually exclusive: a test's
# directory under `tests/` decides which one it carries, applied automatically in
# `tests/conftest.py` and asserted by `tests/contract/test_quality_contract.py`.
#
# The remaining four are orthogonal attributes, applied by hand. They are
# registered now, before anything uses them, because `--strict-markers` means an
# unregistered marker is an error rather than a typo that silently deselects.
markers = [
    "unit: one module, function or class, with its dependencies substituted",
    "contract: a project rule asserted executably rather than merely written down",
    "architecture: the layer contract checked against the real import graph",
    "integration: several GLOBIN components together, still entirely local",
    "property: an invariant asserted over generated input rather than fixed examples",
    "smoke: the smallest set of checks that would catch a broken tree",
    "slow: takes long enough to be worth deselecting during a tight edit loop",
    "network: requires network access; never permitted below the external level",
    "external: talks to a real external system; skipped by default (Phases 033-048)",
    "windows: depends on behaviour specific to the Windows host",
]

# ---------------------------------------------------------------------------
# ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PTH",  # flake8-use-pathlib
    "ARG",  # flake8-unused-arguments
    "TID",  # flake8-tidy-imports
    "RET",  # flake8-return
    "TC",   # flake8-type-checking
    # --- added in Phase 004 -------------------------------------------------
    # Selected against a stated priority order: correctness, import hygiene,
    # unused code, obvious bug patterns, modern Python, maintainability. Each
    # family below earns its place; the rationale is in
    # docs/engineering/STATIC_ANALYSIS.md and is not restated here.
    "S",    # flake8-bandit — subprocess and shell safety, needed by tools/quality
    "PGH",  # pygrep-hooks — blanket `noqa` and `type: ignore` without a code
    "PT",   # flake8-pytest-style — consistent test idiom
    "FURB", # refurb — modern Python constructs
    "TRY",  # tryceratops — exception antipatterns
    "EM",   # flake8-errmsg — exception messages readable in a traceback
    "DTZ",  # flake8-datetimez — naive datetimes; load-bearing for a trading system
    "A",    # flake8-builtins — shadowed builtins
    "ERA",  # eradicate — commented-out code
    "SLF",  # flake8-self — private member access across objects
    "INP",  # flake8-no-pep420 — implicit namespace packages
    # --- added in Phase 014, closing what Phase 004 parked -----------------
    "D",    # pydocstyle — the docstring conventions, under the Google style
]
# Deliberately NOT selected, so the omissions are decisions rather than oversights:
#   ISC001 conflicts with the formatter and would fight `ruff format`.
#   ANN duplicates what mypy already enforces more precisely.
#   PLR magic-value rules are noise against a codebase built from constants.

[tool.ruff.lint.pydocstyle]
# The style this repository has written in since Phase 001, declared rather than
# inferred. Naming it does more than pick a formatter: it resolves the pairs
# pydocstyle ships in mutual conflict — D203 against D211, and D212 against
# D213 — by convention instead of by an arbitrary choice in an ignore list, and
# it switches off the numpydoc section rules that would fight `Args:`/`Returns:`.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Every entry here is an exemption, and an unexplained exemption is how a rule
# set quietly stops meaning anything. State the reason or do not add the line.
# The procedure for adding one is in docs/engineering/STATIC_ANALYSIS.md.
#
# S101 forbids `assert`, on the grounds that `python -O` strips it. In a test
# module `assert` *is* the assertion mechanism, and pytest is never run with -O.
"tests/**" = [
    "S101",
    # D103 requires a docstring on every public function. In a library that is
    # the right rule; in a test module it is a category error, because a test
    # function is public only in the sense that nothing marks it private — it is
    # not API, nothing imports it, and its name is already a sentence:
    # `test_the_dependency_contract_declares_a_policy_for_every_layer` states its
    # assertion more precisely than a restating docstring would.
    #
    # This exempts the REQUIREMENT, not the practice. Most tests here carry a
    # docstring and should, because the valuable half is the *why* — the failure
    # it once caught, the reasoning it pins. D205, D209, D400 and the rest still
    # apply to every docstring that exists, so the ones written are held to the
    # same standard as the package's. What is dropped is the obligation to write
    # one where the name has already said it.
    "D103",
]

[tool.ruff.lint.isort]
known-first-party = ["globin", "tests", "tools"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/globin", "tests", "tools"]

# Phase 004 replaced `strict = true` with the flags it stands for.
#
# `--strict` is an alias whose membership is decided by mypy, not by GLOBIN. Its
# contents have grown between releases, and they will grow again. Under the
# alias, upgrading mypy silently changes what this repository's type contract
# *means* — a check appears or disappears with no diff, no ADR and no test. That
# is precisely the drift `SOURCE_OF_TRUTH.md` exists to prevent.
#
# The thirteen flags below are what `mypy --strict` expanded to on the version
# this was written against (2.1.0), read from `mypy --help` rather than from
# memory. A future mypy that adds a flag to `--strict` will not add it here; it
# will be adopted deliberately, in a change someone can read.
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

# Beyond `--strict`.
#
# `disallow_any_explicit` is deliberately NOT enabled. The contract tests parse
# TOML with `tomllib`, whose return type is genuinely `dict[str, Any]`; banning
# explicit `Any` would be satisfied by casting the same values through a lie.
# `Any` is controlled here by review and by the boundary typing rule in
# ENGINEERING_CONTRACT.md invariant 8, not by a flag that invites laundering.
warn_unused_configs = true
warn_unreachable = true

# `ignore-without-code` is what turns "a `# type: ignore` must be justified"
# from advice into a build failure: a bare ignore silences every error on the
# line, including ones nobody has seen yet.
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "unused-awaitable",
]

show_error_codes = true
pretty = true

# The one untyped import in the tree, and it is narrow on purpose.
#
# `pandas` ships no type information and mypy's advice is `pandas-stubs`. That is
# a THIRD-PARTY package maintained separately from pandas itself, and adding it
# would need a written review under `docs/DEPENDENCY_POLICY.md` to type six lines
# in one module — `tools/quality/stack/probes.py`, which imports pandas to
# measure its behaviour and does nothing else with it.
#
# `numpy` is deliberately absent from this list: it ships its own types, and they
# are checked. If a later phase adopts pandas into `src/globin` rather than merely
# verifying it, this exemption is the wrong tool and `pandas-stubs` becomes worth
# reviewing properly. Recorded here rather than as a `# type: ignore` so that the
# exemption is one visible line instead of one per import site.
#
# `pandas` alone, without a `pandas.*` wildcard: `warn_unused_configs` reports an
# override nothing matches, so the pattern is kept exactly as wide as the imports
# that exist. A submodule import would fail here and be added deliberately.
[[tool.mypy.overrides]]
module = ["pandas"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
# `tools` is measured too. The quality entrypoint decides whether a gate ran and
# what its exit code was; untested, it could report success for a check that
# never executed, which is the one failure this whole phase exists to prevent.
source = ["globin", "tools"]
# Branch coverage, not line coverage. A line-covered `if` whose false arm is
# never taken reads as tested and is not; for policy code made almost entirely
# of conditionals, the line number on its own is close to meaningless.
branch = true

[tool.coverage.report]
show_missing = true
# A floor, not a target. It exists to catch a regression — a module quietly
# losing its tests — and deliberately sits below the current figure so that
# ordinary refactoring does not fail the build. It is not a score to raise, and
# padding it with tests that assert nothing would make the number better and the
# suite worse. See docs/engineering/QUALITY_GATES.md.
fail_under = 95
# `exclude_also` ADDS to coverage's own defaults; `exclude_lines` would replace
# them, silently dropping the built-in `pragma: no cover` handling.
exclude_also = [
    # A `if TYPE_CHECKING:` body never executes at runtime by construction.
    "if TYPE_CHECKING:",
    # The body of a Protocol method or an abstract stub. `globin.ports` is
    # entirely these: `...` is the whole declaration, and there is nothing there
    # to test.
    "^\\s*\\.\\.\\.$",
    "@(abc\\.)?abstractmethod",
]

# ---------------------------------------------------------------------------
# mutation testing
# ---------------------------------------------------------------------------
# Coverage says a line ran. Mutation testing says whether anything would have
# noticed it being different, which is the question a suite full of assertions
# that assert nothing would still fail. The two are separate evidence and
# neither replaces the other.
#
# GLOBIN's own harness rather than a third-party tool, and not by preference:
# mutmut calls os.fork() and its documentation requires WSL on Windows, while
# this project's declared host and its CI are both Windows (ADR-0009).
# cosmic-ray is cross-platform but brings thirteen transitive dependencies —
# aiohttp, gitpython and sqlalchemy among them — into a repository whose
# `dependencies = []` is asserted by a contract test, and reviewing a dependency
# of that size is Phase 014's process, which does not exist yet. See ADR-0032.
[tool.globin.mutation]
# The committed record of which mutants are known to survive, and why. Nothing
# writes it: tomllib reads TOML and cannot emit it, so the harness has no
# --update and a stale baseline has to be corrected by a person.
baseline = "docs/engineering/mutation-baseline.toml"

# What is copied into the throwaway tree. `pyproject.toml` is load-bearing here:
# pytest resolves `pythonpath = ["src", "."]` against its rootdir and inserts the
# result at sys.path[0], ahead of anything PYTHONPATH could contribute. Without
# the sandbox owning this file the child would import the real globin package and
# report every mutant as surviving.
#
# `docs` is here because the contract test below reads VALUE_TYPES_POLICY.md. That
# test is what binds a published bound to its documented value, so without the
# document a mutant changing `MAX_SIGNIFICANT_DIGITS` would survive — not because
# nothing checks it, but because the check was outside the sandbox.
sandbox = ["pyproject.toml", "src", "tests", "tools", "docs"]

# The per-mutant budget is max(floor, control * factor), where `control` is the
# unmutated subset timed on this machine. Relative rather than absolute so that a
# slow machine gets a proportionally longer budget. An undeclared timeout is
# never a verdict — it stops the run as unmeasured.
timeout_factor = 8
timeout_floor_seconds = 30

[[tool.globin.mutation.target]]
# The Phase 008 value types: pure, branch-dense, and the place where a missing
# boundary test would let an inexact amount through.
module = "src/globin/domain/values.py"
# File paths, never a `-k` expression or a marker. A mistyped path is caught
# before anything launches; a mistyped selector makes pytest exit 5 having
# collected nothing, which a careless reading scores as a flawless run.
tests = [
    "tests/unit/test_values.py",
    "tests/property/test_values_properties.py",
    "tests/contract/test_values_contract.py",
]

[[tool.globin.mutation.target]]
# The Phase 010 precision rules: pure, branch-dense, and the module where a
# missing boundary test would let a rounding happen in the wrong direction —
# which is the failure this phase exists to prevent and the one a reader of the
# result could not detect.
module = "src/globin/domain/precision.py"
tests = [
    "tests/unit/test_precision.py",
    "tests/property/test_precision_properties.py",
    "tests/contract/test_precision_contract.py",
]

# ---------------------------------------------------------------------------
# The aggregate CI gate (Phase 012, as tooling under ADR-0032; see ADR-0042).
#
# Declared here rather than inferred from the workflow, because a gate that
# discovered which jobs matter by looking at which jobs reported would be
# satisfied by a workflow with every job deleted. `tests/contract` compares this
# table against `.github/workflows/quality.yml` in both directions, so a job
# added there without being considered here, or removed from there while still
# required here, fails the suite rather than quietly changing what the check
# means.
# ---------------------------------------------------------------------------
[tool.globin.workflow]
# Every job whose success the aggregate check depends on. Job KEYS, not display
# names: the key is what appears in the `needs` context, and the display name is
# what appears as a status check. Conflating them is how a rename silently drops
# a requirement.
required_jobs = ["quality", "mutation", "shards", "runtime", "supply", "evidence", "hygiene"]

# The single check name to mark as required on `master`. Stable by design: it
# carries no operating system, no interpreter version and no matrix value, so the
# branch protection rule survives a change to any of them. The matrix jobs cannot
# serve this purpose — they are named `Quality (Python 3.12)` and
# `Quality (Python 3.14)`, and adding an interpreter would leave the rule
# pointing at a set that no longer describes the workflow.
# Jobs that are neither a check nor the aggregate: they PUBLISH something about
# a run that has already been judged. `attest` signs a statement that this
# workflow, at this commit, produced the supply-chain evidence — a claim about
# provenance, not a verdict about quality.
#
# Kept out of `required_jobs` deliberately. It runs only on a push to master, so
# requiring it would fail every pull-request run for the absence of a job that
# pull requests must not run. Declared here rather than left unlisted, because a
# job in neither list is a job nobody decided about.
publishing_jobs = ["attest"]

required_check = "Quality gate"

# What the evidence bundle is uploaded as. One artifact from one job, so there is
# no matrix value in the name and no chance of two jobs racing to write it.
artifact = "test-evidence-windows-py314"

# How long GitHub keeps that bundle. Thirty days is long enough to diagnose a
# failure somebody noticed late and short enough not to accumulate; it is also
# what the evidence job has used since Phase 010, kept rather than changed. The
# permitted range is 1 to 90, and a repository or organisation setting can cap it
# below whatever is written here — this is a request, not a guarantee.
retention_days = 30

# How long each job may run before GitHub stops it, in minutes.
#
# An undeclared timeout is not "no timeout": it is GitHub's default of six hours,
# which is long enough that a job wedged on a network read looks like a job still
# working, for most of a working day. Every value here is therefore deliberate.
#
# The numbers are derived from measured runs, not chosen for roundness. Across
# runs 31848929219, 31853639648 and 31854207475 the observed maxima were
# `quality` 2.5, `mutation` 6.5, `shards` 1.8, `evidence` 2.1, `hygiene` 1.0 and
# `aggregate` 0.7 minutes. Each budget below is roughly five to ten times its
# job's observed maximum, with a floor of ten minutes so that a cold runner or a
# slow package index produces a slower run rather than a red one.
#
# `mutation` gets the largest budget because it is the only job whose cost scales
# with something a later phase will change: it runs a pytest subset once per
# mutant, so adding a target lengthens it. `aggregate` gets the smallest work but
# not the smallest budget, because it downloads an artifact and a stalled
# download is exactly the failure this table exists to bound.
#
# `tests/contract/test_ci_security_contract.py` compares these against
# `.github/workflows/quality.yml` in both directions, so a job added there
# without a budget here, or a budget here for a job that no longer exists, fails
# the suite rather than quietly going unbounded.
[tool.globin.workflow.timeouts]
quality = 15
mutation = 30
shards = 15
# Added in Phase 014. Unlike every other budget here it is NOT derived from an
# observed run, because there is no observed run to derive it from: this is the
# job's first commit. It is set to the same 15 the comparable jobs carry, and it
# is the one number in this table that should be revisited against measurement
# rather than trusted — see `docs/research/phase_014_sources.md`.
#
# It is also the only job that waits on something outside GitHub. A slow package
# index or an advisory service under load lengthens it in a way no local change
# explains, which is an argument for margin rather than for precision.
supply = 15
evidence = 15
hygiene = 10
# Added in Phase 014. Downloads one small artifact and signs it; the budget is
# for the network, not for the work. Like `supply`, it has no measured run
# behind it yet.
attest = 10
# Added in Phase 017. Like `supply` and `attest` when they arrived, it has no
# measured run behind it yet, and like `supply` it waits on something outside
# GitHub: `bootstrap.ps1` installs the pinned toolchain from a package index, so
# a slow index lengthens it in a way no local change explains.
#
# Raised from 10 to 15 in Phase 020, when `bootstrap.ps1` began installing from
# `pylock.dev.toml`: forty-nine wheels rather than the seven the workflow register
