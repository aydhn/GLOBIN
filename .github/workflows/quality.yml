# ---------------------------------------------------------------------------
# GLOBIN quality workflow.
#
# CI VERIFIES; IT DOES NOT REPAIR. No step here commits, pushes, formats,
# applies a fix, or writes to the repository in any way. A pipeline that
# corrects what it is measuring cannot tell you whether the thing you committed
# was correct.
#
# It also runs no secret, reaches no exchange, uses no credential and deploys
# nothing. GLOBIN does not trade (ROADMAP.md), and the day it does, exchange
# access will still not belong in a pull-request check.
#
# The gate itself is NOT defined here. `python -m tools.quality full` reads the
# command table in `tools/quality/commands.py`, which is the same table
# `scripts/verify.ps1` and the pre-commit hook use. That is deliberate: when CI
# keeps its own list of checks, the list drifts from the developer's, and the
# difference surfaces as a failure nobody can reproduce locally.
# ---------------------------------------------------------------------------

name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege. The quality jobs read the repository and write nothing back,
# so the token they are handed can do exactly that and no more. Declaring it at
# workflow level means a job added later starts read-only rather than inheriting
# whatever the repository default happens to be.
permissions:
  contents: read

# Supersede an in-flight run when a newer commit arrives on the same ref. The
# older run's verdict is about code nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    # Windows is the only platform GLOBIN declares (ADR-0009, and the
    # `Operating System :: Microsoft :: Windows` classifier). It is also the
    # platform that actually exercises the CRLF/LF rules in `.gitattributes`,
    # which a Linux runner would never test.
    runs-on: windows-latest

    strategy:
      # Run every interpreter even after one fails. Knowing a break is
      # version-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        # PROVISIONAL, and owned by Phases 017-032. 3.12 is the floor
        # `requires-python` declares; 3.14 is what development actually happens
        # on. Testing both endpoints catches drift between them without
        # pretending to be the final runtime matrix — interpreter selection and
        # pinning is Phase 018, dependency locking is Phase 020.
        python-version: ['3.12', '3.14']

    steps:
      # Actions are pinned to full commit SHAs, not tags. A tag is mutable: the
      # owner of the action can move it, and a moved tag silently changes what
      # runs against this repository. The trailing comment records which release
      # each SHA was, for humans; the SHA is what executes.
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the quality toolchain
        # Exact versions, so CI's verdict changes only when someone changes it.
        # A floating range means a lint rule can appear overnight and fail a
        # build nobody touched. These pins mirror the `dev` extra in
        # `pyproject.toml` and the `ruff-pre-commit` revision, so the hook, the
        # local gate and CI all run the same tools.
        #
        # The GLOBIN package itself is deliberately NOT installed. `pythonpath`
        # in `pyproject.toml` runs the suite straight from `src/`, and building
        # a distribution is Phase 017-032 work that must not be described as
        # verified before then.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.15.14" "mypy==2.1.0" "pytest==9.0.3" "pytest-cov==7.1.0" "hypothesis==6.165.7"

      - name: Run the canonical quality gate
        run: python -m tools.quality full

  mutation:
    name: Mutation baseline
    # After the canonical gate rather than beside it. A mutation result on a tree
    # that does not lint or type-check is noise, and this way the job costs
    # nothing on a commit that was going to fail anyway.
    needs: quality
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.14'

      - name: Install what the harness launches
        # No ruff and no mypy: the harness lints nothing and type-checks nothing,
        # it copies the tree and runs a pytest subset against one mutated module
        # at a time. Same pins as the jobs above, for the same reason.
        #
        # One interpreter, not the matrix. `ast.unparse` is not guaranteed to
        # produce identical text across Python versions, so a baseline recorded
        # against one interpreter is evidence about that interpreter. Running it
        # twice would be claiming more than the tool can support.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.0.3" "hypothesis==6.165.7"

      - name: Compare the mutation baseline
        run: python -m tools.quality mutation

  shards:
    name: Sharded execution
    # After the canonical gate, for the same reason the mutation job is: a
    # partitioning result on a tree that does not lint or type-check is noise.
    needs: quality
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.14'

      - name: Install what the harness launches
        # No ruff and no mypy: the harness lints nothing and type-checks nothing.
        # `pytest-cov` is here because each shard child passes `--cov`, and
        # `hypothesis` because each is given `--hypothesis-profile=ci`.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.0.3" "pytest-cov==7.1.0" "hypothesis==6.165.7"

      - name: Run the suite as deterministic shards
        # `windows-latest`, like every other job. The brief for this work asked
        # for a Linux runner too; MEMORY.md records CI staying Windows-only as a
        # decision already taken and reaffirmed, on the grounds that Windows is
        # the only platform GLOBIN declares (ADR-0009) and the only one
        # exercising the CRLF rules in `.gitattributes`.
        run: python -m tools.quality shards

  evidence:
    name: Test evidence
    # After the canonical gate, for the same reason the other two are: evidence
    # about a tree that does not lint or type-check is evidence about something
    # nobody will merge.
    needs: quality
    runs-on: windows-latest

    outputs:
      # The artifact's own SHA-256, which GitHub computes as the upload
      # completes. It is published HERE, as a job output, and deliberately not
      # written into the bundle: a file cannot contain its own hash, and an
      # artifact carrying its own digest would be exactly that. The bundle
      # carries `checksums.sha256`, computed before upload, covering each file
      # inside it. Two layers, and neither contains the other — ADR-0042.
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.14'

      - name: Install what the harness launches
        # Every tool the gate starts as a child, at the same pins as every other
        # job. `pytest-cov` because the child passes `--cov`, `hypothesis`
        # because it is given `--hypothesis-profile=ci`, and `ruff` and `mypy`
        # because the gate runs them itself to record what they found. They are
        # declared in the command table too, so a machine missing one reports a
        # missing tool rather than an unmeasured gate.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.15.14" "mypy==2.1.0" "pytest==9.0.3" "pytest-cov==7.1.0" "hypothesis==6.165.7"

      - name: Produce the test evidence
        # Writes the step summary itself, through $GITHUB_STEP_SUMMARY, using the
        # same code path that writes nothing when the variable is unset. There is
        # no CI-only reporting logic here.
        run: python -m tools.quality evidence

      - name: Verify the evidence
        # `always()`, so a failing suite still has its evidence checked before it
        # is uploaded. This is NOT `continue-on-error`: the step's own failure
        # still fails the job. The two look alike and are opposites, and
        # `tests/contract/test_evidence_contract.py` pins the difference.
        if: always()
        run: python -m tools.quality.evidence verify

      - name: Upload the evidence
        # `always()` for the same reason, and it is the load-bearing one: a run
        # that failed is exactly when somebody needs the JUnit report and the
        # timings. Uploading them does not make the job pass — the steps above
        # have already decided that.
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-windows-py314
          # The nine evidence files and the browsable coverage tree beside them.
          # No caches and no virtual environment. The raw coverage database is
          # not here either: the gate deletes it once the reports are written,
          # because it is a binary store of absolute paths and every number in it
          # is already in coverage.json.
          path: .globin/evidence/
          # Explicit rather than inherited from the repository default, which a
          # setting nobody remembers could change under this workflow.
          retention-days: 30
          # A run that produced nothing has already failed above; saying so here
          # too turns a confusing empty artifact into a named error.
          if-no-files-found: error

  hygiene:
    name: Pre-commit hooks
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.14'

      - name: Install pre-commit and the tools its local hook needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pre-commit==4.6.2" "pytest==9.0.3" "pytest-cov==7.1.0" "hypothesis==6.165.7"

      - name: Run every hook over every file
        # `--show-diff-on-failure` prints what an autofixing hook WOULD change.
        # The change is shown, never committed: the fix is the author's to make
        # and to look at.
        run: python -m pre_commit run --all-files --show-diff-on-failure

  aggregate:
    # THE check to mark as required on `master`. Its displayed name is stable by
    # construction: no operating system, no interpreter version, no matrix value,
    # so a branch protection rule survives a change to any of them. The matrix
    # jobs cannot serve the purpose — they appear as `Quality (Python 3.12)` and
    # `Quality (Python 3.14)`, and adding an interpreter would leave the rule
    # naming a set that no longer describes the workflow.
    #
    # The name is declared in `[tool.globin.workflow]` too, and a contract test
    # compares the two, so renaming this job without updating the documentation
    # fails the suite rather than quietly detaching the rule from the check.
    name: Quality gate
    needs: [quality, mutation, shards, evidence, hygiene]

    # `!cancelled()` rather than `always()`, and the difference is the point.
    #
    # Without any `if:`, GitHub SKIPS a job whose dependency failed — and a
    # skipped required check is not reported to branch protection as a failing
    # one. A rule requiring this check would then be satisfied by a run in which
    # every job it depends on had failed. That is the hole this job exists to
    # close, so it has to run precisely when something upstream did not.
    #
    # `always()` would also run it when the whole run was cancelled. With
    # `cancel-in-progress: true` above, every push cancels the run before it, so
    # `always()` would spend a runner and post a confusing failing check on every
    # superseded run. `!cancelled()` skips those and still runs after a failure.
    # A single job that was cancelled while the run was not still reaches the
    # aggregate, which reads it as unmeasured.
    if: ${{ !cancelled() }}
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.14'

      # No `pip install`. This job starts no tool: it reads two files and some
      # environment variables. Every number it reports was measured by a job
      # above, and re-measuring here would be asking a second machine the same
      # question and believing whichever answer arrived last.

      - name: Download the evidence this run published
        # `!cancelled()` so that a failed evidence job still has its bundle
        # fetched — the upload step above runs on `always()`, so the artifact
        # exists even when the suite failed.
        #
        # If there is genuinely nothing to download this step fails, the job
        # fails, and the aggregate below still runs and records why. That is the
        # intended shape: the missing artifact is itself the finding.
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-evidence-windows-py314
          # Where the evidence gate writes and reads, so the verifier below needs
          # no argument and no second notion of where evidence lives.
          path: .globin/evidence

      - name: Verify the evidence that was published
        # The same verifier the evidence job already ran, against different
        # bytes: these have been through upload and download. It re-checks the
        # manifest's digest, every file's checksum, the count arithmetic and the
        # redaction rules, so a bundle corrupted or truncated in transit is
        # caught here rather than trusted because a job said it was fine.
        if: ${{ !cancelled() }}
        run: python -m tools.quality.evidence verify

      - name: Decide whether this run passed
        # The one place the verdict is made. It reads every job's result and the
        # evidence just verified, writes `aggregate-quality.json`, appends the
        # step summary, and exits non-zero unless every required job passed and
        # the evidence agreed. Locally the same command reads the evidence the
        # last local run wrote, so a developer and CI apply one evaluator.
        if: ${{ !cancelled() }}
        env:
          # Passed through the environment rather than as arguments: this is a
          # JSON document full of quotes and braces, and threading one through a
          # `run:` line intact on a Windows runner is a quoting problem with no
          # upside.
          GLOBIN_WORKFLOW_NEEDS: ${{ toJSON(needs) }}
          GLOBIN_WORKFLOW_ARTIFACT_DIGEST: ${{ needs.evidence.outputs.artifact-digest }}
        run: python -m tools.quality aggregate

      - name: Upload the aggregate verdict
        # Small, and separate from the evidence bundle on purpose: this document
        # records the digest of that bundle, so putting it inside would make the
        # bundle's digest depend on a value derived from the bundle.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-verdict
          path: .globin/workflow/
          retention-days: 30
          if-no-files-found: error
