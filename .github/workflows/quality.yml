# ---------------------------------------------------------------------------
# GLOBIN quality workflow.
#
# CI VERIFIES; IT DOES NOT REPAIR. No step here commits, pushes, formats,
# applies a fix, or writes to the repository in any way. A pipeline that
# corrects what it is measuring cannot tell you whether the thing you committed
# was correct.
#
# It also runs no secret, reaches no exchange, uses no credential and deploys
# nothing. GLOBIN does not trade (ROADMAP.md), and the day it does, exchange
# access will still not belong in a pull-request check.
#
# The gate itself is NOT defined here. `python -m tools.quality full` reads the
# command table in `tools/quality/commands.py`, which is the same table
# `scripts/verify.ps1` and the pre-commit hook use. That is deliberate: when CI
# keeps its own list of checks, the list drifts from the developer's, and the
# difference surfaces as a failure nobody can reproduce locally.
# ---------------------------------------------------------------------------

name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # So the aggregate check below can be required by a merge queue without the
  # queue then waiting forever for a check that never starts. Nothing here
  # enables a merge queue — that is a repository setting no file can change — but
  # a workflow that cannot run on `merge_group` is a workflow that quietly rules
  # the option out.
  #
  # `checks_requested` is the only activity type GitHub documents for this event.
  # Naming it is the documentation's own advice: an unlisted type added later
  # would otherwise start triggering this workflow without anybody deciding so.
  #
  # Safe here because no expression in this file is pull-request-only. The whole
  # set is `github.workflow`, `github.ref`, `matrix.*`, `needs.*`, `toJSON(needs)`
  # and `!cancelled()`, and every one of them is defined under a merge-group
  # event.
  merge_group:
    types: [checks_requested]

# Least privilege. The quality jobs read the repository and write nothing back,
# so the token they are handed can do exactly that and no more. Declaring it at
# workflow level means a job added later starts read-only rather than inheriting
# whatever the repository default happens to be.
permissions:
  contents: read

# Supersede an in-flight run when a newer commit arrives on the same ref. The
# older run's verdict is about code nobody will merge.
#
# The group is namespaced by `github.workflow`, so a second workflow added later
# cannot land in this one's group and cancel runs it knows nothing about.
#
# Cancellation is conditional, and master is the exception. Everywhere else a
# superseded run is worth nothing: the commit it judged has already been replaced.
# On master the run is the only thing that produces that commit's evidence
# bundle, and a cancelled job reports `cancelled`, which the aggregate reads as
# UNMEASURED rather than passed. Cancelling master runs would therefore trade a
# few runner-minutes for a permanent hole in the evidence chain, one commit wide.
# Pushes to master queue instead.
#
# A merge-group run is not master: `github.ref` under that event is the ref of
# the merge group, so a queue entry superseded by a new queue state is still
# cancelled, which is what should happen to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    # Windows is the only platform GLOBIN declares (ADR-0009, and the
    # `Operating System :: Microsoft :: Windows` classifier). It is also the
    # platform that actually exercises the CRLF/LF rules in `.gitattributes`,
    # which a Linux runner would never test.
    runs-on: windows-latest
    # Every job in this file declares a budget, and every budget is declared
    # twice: here, and in `[tool.globin.workflow.timeouts]`, which
    # `tests/contract/test_ci_security_contract.py` compares against this file in
    # both directions. Without one, a job runs until GitHub's platform ceiling of
    # six hours terminates it — long enough that a job wedged on a network read
    # looks, for most of a working day, like a job still working.
    #
    # The numbers come from measured runs rather than from caution. See the
    # settings file for the observed maxima each was derived from.
    timeout-minutes: 15

    strategy:
      # Run every interpreter even after one fails. Knowing a break is
      # version-specific is most of the diagnosis.
      fail-fast: false
      matrix:
        # PROVISIONAL, and owned by Phases 017-032. 3.12 is the floor
        # `requires-python` declares; 3.14 is what development actually happens
        # on. Testing both endpoints catches drift between them without
        # pretending to be the final runtime matrix — interpreter selection and
        # pinning is Phase 018, dependency locking is Phase 020.
        python-version: ['3.12', '3.14']

    steps:
      # Actions are pinned to full commit SHAs, not tags. A tag is mutable: the
      # owner of the action can move it, and a moved tag silently changes what
      # runs against this repository. The trailing comment records which release
      # each SHA was, for humans; the SHA is what executes.
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the quality toolchain
        # Exact versions, so CI's verdict changes only when someone changes it.
        # A floating range means a lint rule can appear overnight and fail a
        # build nobody touched. These pins mirror the `dev` extra in
        # `pyproject.toml` and the `ruff-pre-commit` revision, so the hook, the
        # local gate and CI all run the same tools.
        #
        # The GLOBIN package itself is deliberately NOT installed. `pythonpath`
        # in `pyproject.toml` runs the suite straight from `src/`, and building
        # a distribution is Phase 017-032 work that must not be described as
        # verified before then.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.15.14" "mypy==2.1.0" "pytest==9.0.3" "pytest-cov==7.1.0" "hypothesis==6.165.7"

      - name: Run the canonical quality gate
        run: python -m tools.quality full

  mutation:
    name: Mutation baseline
    # After the canonical gate rather than beside it. A mutation result on a tree
    # that does not lint or type-check is noise, and this way the job costs
    # nothing on a commit that was going to fail anyway.
    needs: quality
    runs-on: windows-latest
    # The largest budget in the file, and the only one whose cost scales with
    # something a later phase will change: the harness runs a pytest subset once
    # per mutant, so declaring another target lengthens this job.
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install what the harness launches
        # No ruff and no mypy: the harness lints nothing and type-checks nothing,
        # it copies the tree and runs a pytest subset against one mutated module
        # at a time. Same pins as the jobs above, for the same reason.
        #
        # One interpreter, not the matrix. `ast.unparse` is not guaranteed to
        # produce identical text across Python versions, so a baseline recorded
        # against one interpreter is evidence about that interpreter. Running it
        # twice would be claiming more than the tool can support.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.0.3" "hypothesis==6.165.7"

      - name: Compare the mutation baseline
        run: python -m tools.quality mutation

  shards:
    name: Sharded execution
    # After the canonical gate, for the same reason the mutation job is: a
    # partitioning result on a tree that does not lint or type-check is noise.
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install what the harness launches
        # No ruff and no mypy: the harness lints nothing and type-checks nothing.
        # `pytest-cov` is here because each shard child passes `--cov`, and
        # `hypothesis` because each is given `--hypothesis-profile=ci`.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.0.3" "pytest-cov==7.1.0" "hypothesis==6.165.7"

      - name: Run the suite as deterministic shards
        # `windows-latest`, like every other job. The brief for this work asked
        # for a Linux runner too; MEMORY.md records CI staying Windows-only as a
        # decision already taken and reaffirmed, on the grounds that Windows is
        # the only platform GLOBIN declares (ADR-0009) and the only one
        # exercising the CRLF rules in `.gitattributes`.
        run: python -m tools.quality shards

  runtime:
    name: Runtime baseline
    # After the canonical gate, for the same reason the mutation and shards jobs
    # are: a statement about the host a tree was measured on is worth little if
    # the tree does not lint or type-check.
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      # No `pip install` step. This job's whole point is that `bootstrap.ps1`
      # installs the toolchain itself, from the pins these workflows already
      # declare — a job that pre-installed them would be testing something other
      # than the thing developers run.

      - name: Build the environment from a clean machine
        # The strongest evidence Phase 017 can produce: a hosted runner that has
        # never seen this repository builds the environment the same way a
        # developer does, from the same script, with no step in between.
        #
        # `setup-python` resolves `3.14` to the newest patch it publishes, which
        # is at or above the contract's floor. If it ever resolves below one, this
        # job fails with RUNTIME_INTERPRETER_NONCOMPLIANT and names both versions,
        # which is the report to act on rather than a mystery.
        run: powershell -ExecutionPolicy Bypass -File scripts/bootstrap.ps1

      - name: Check the host through the environment it just built
        # Deliberately a second run, and deliberately through the same script a
        # developer runs. The manifest that survives is the one written by the
        # environment's own interpreter, which `preflight.ps1` resolves; a
        # manifest describing the interpreter that built it would be evidence
        # about the wrong Python.
        #
        # Invoked as the script rather than as the environment's interpreter
        # directly, so that this workflow contains no path into the environment.
        # `tests/contract/test_evidence_contract.py` forbids one anywhere in this
        # file, on the grounds that an uploaded artifact must carry evidence and
        # not a machine's state — and a coarse rule that holds is worth more than
        # a precise one nobody maintains.
        run: powershell -ExecutionPolicy Bypass -File scripts/preflight.ps1

      - name: Upload the runtime evidence
        # One path, like every other upload here: adding a second re-roots the
        # archive at the least common ancestor and silently breaks whatever
        # consumes it, which is how `attest` broke in Phase 015.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-evidence
          path: .globin/runtime/
          retention-days: 30
          if-no-files-found: error

  supply:
    name: Supply chain
    # After the canonical gate, for the same reason the others are: a
    # supply-chain result on a tree that does not lint or type-check is a result
    # about something nobody will merge.
    needs: quality
    runs-on: windows-latest
    # The only job in this file that reaches anything outside the runner:
    # `pip-audit` resolves a requirements file against an index and queries an
    # advisory service, and the capability probe asks the GitHub API about
    # repository settings. Both are bounded by the budget rather than trusted to
    # return.
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The whole history, because the secret scan reads what Git tracks and
          # the manifest records the commit's own date. A shallow clone would
          # still answer both, but `git show -s --format=%cI` on a truncated
          # history is a question with a surprising answer, and this job is
          # cheap enough not to economise on.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install the audit tool
        # `pip-audit` and nothing else. This gate lints nothing, type-checks
        # nothing and runs no test; it reads manifests, renders an SBOM and asks
        # an advisory service about a list of versions.
        #
        # Pinned exactly, like every other tool in this file, and reviewed
        # through the process this phase introduces —
        # `docs/engineering/dependency-reviews.toml` carries the record.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit==2.9.0"

      - name: Run the supply-chain gate
        env:
          # So the capability probe can ask. This is the run's own token with
          # the workflow-level `contents: read` and nothing more, which is the
          # point: what it CANNOT read is recorded as
          # UNAVAILABLE_BY_PERMISSION rather than guessed at or skipped. A
          # settings question answered by an under-scoped token is still a
          # better record than no question asked.
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.quality supply

      - name: Run the governance gate
        # In this job rather than in one of its own, and that is a decision.
        # Governance and supply chain are the two halves of one question — what
        # this repository is answerable for — and the capability probe that says
        # whether private vulnerability reporting is switched on already runs in
        # the step above. A second job would need a second checkout, a second
        # interpreter, a `required_jobs` entry and a timeout budget, to run a
        # gate that reads files for a few seconds.
        #
        # NO TOKEN, and no `env:` block at all. Unlike the step above this one
        # reaches nothing: every check reads the working tree. That is what makes
        # it safe on a pull request from a fork, where the code being checked is
        # code anybody wrote.
        #
        # `always()`, so that a failing supply-chain gate does not hide a
        # governance finding. Two independent questions should produce two
        # answers, and the job fails if either does.
        if: always()
        run: python -m tools.quality governance

      - name: Run the release gate
        # In this job for the reason the governance step gives, plus one of its
        # own: the release gate REPUBLISHES the SBOM the supply gate just wrote
        # to `.globin/supply/`. In a job of its own it would need that artifact
        # downloaded, or would have to regenerate a document that ought to be
        # byte-identical and would then have to be compared. Running it here
        # means the file it copies is the file that was produced.
        #
        # `check` rather than `ready`, and that is the whole reason there are two
        # subcommands. `ready` asks about the working tree — branch, cleanliness,
        # agreement with the remote — and a CI checkout legitimately differs from
        # a developer's tree. Asking it here would make an unmeasurable condition
        # fail every run, and since unmeasured outranks failed it would be the
        # loudest possible failure for the least real reason.
        #
        # NO TOKEN and no `env:` block. Like governance and unlike supply, this
        # reaches nothing.
        #
        # `always()`, on the same reasoning: a failing supply-chain gate must not
        # hide a release finding.
        if: always()
        run: python -m tools.quality release

      - name: Upload the supply-chain evidence
        # `always()`, for the reason the evidence upload gives: a run that failed
        # is exactly when somebody needs the manifest, the SBOM and the
        # inventory. Uploading them does not make the job pass — the step above
        # has already decided that.
        #
        # ONE PATH, DELIBERATELY. Phase 015 briefly added `.globin/governance/`
        # to this same upload and broke the `attest` job, which is worth
        # recording rather than quietly reverting: with two paths,
        # `upload-artifact` roots the archive at their LEAST COMMON ANCESTOR, so
        # the files moved from `supply-manifest.json` to `supply/supply-manifest.json`
        # and `attest`'s `supply-evidence/*.json` matched nothing. The aggregate
        # still passed, because `attest` publishes rather than judges and is
        # deliberately outside `required_jobs` — which is the design working, and
        # is also why the breakage had to be read out of the run rather than
        # inferred from the verdict.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence
          path: .globin/supply/
          retention-days: 30
          if-no-files-found: error

      - name: Upload the governance evidence
        # Its own artifact rather than a second path above, so that the layout
        # `attest` depends on cannot be changed by adding one. Named for what it
        # holds, which is also easier to find than a subdirectory of something
        # else.
        #
        # NOT ATTESTED, and that is a decision. The `attest` job signs a
        # provenance statement about supply-chain evidence, because an SBOM is a
        # claim somebody downstream might rely on. The governance manifest is
        # this repository's verdict about its own ownership arrangement; nothing
        # consumes it elsewhere, so signing it would widen a privileged job's
        # subject for no reader. Extending it later is a decision to record, not
        # a default to inherit.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governance-evidence
          path: .globin/governance/
          retention-days: 30
          if-no-files-found: error

      - name: Upload the release evidence
        # Its own artifact, for the reason the governance upload gives about
        # `attest`'s expected layout: adding a second path to an existing upload
        # re-roots that archive at the least common ancestor and silently breaks
        # whatever consumes it.
        #
        # These are the files a release publishes — the acceptance record, the
        # manifest and SHA256SUMS. Uploading them here means a run can be shown
        # to have produced the same bytes that were attached to the release,
        # which is the point of them being deterministic.
        #
        # NOT ATTESTED, on the same reasoning as the governance manifest: the
        # `attest` job signs a provenance statement about supply-chain evidence
        # because an SBOM is a claim somebody downstream might rely on. Widening
        # a privileged job's subject is a decision to record, not a default to
        # inherit. The published release carries GitHub's own release
        # attestation, which is a different mechanism and covers the assets as
        # published.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: .globin/release/
          retention-days: 30
          if-no-files-found: error

  evidence:
    name: Test evidence
    # After the canonical gate, for the same reason the other two are: evidence
    # about a tree that does not lint or type-check is evidence about something
    # nobody will merge.
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 15

    outputs:
      # The artifact's own SHA-256, which GitHub computes as the upload
      # completes. It is published HERE, as a job output, and deliberately not
      # written into the bundle: a file cannot contain its own hash, and an
      # artifact carrying its own digest would be exactly that. The bundle
      # carries `checksums.sha256`, computed before upload, covering each file
      # inside it. Two layers, and neither contains the other — ADR-0042.
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install what the harness launches
        # Every tool the gate starts as a child, at the same pins as every other
        # job. `pytest-cov` because the child passes `--cov`, `hypothesis`
        # because it is given `--hypothesis-profile=ci`, and `ruff` and `mypy`
        # because the gate runs them itself to record what they found. They are
        # declared in the command table too, so a machine missing one reports a
        # missing tool rather than an unmeasured gate.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.15.14" "mypy==2.1.0" "pytest==9.0.3" "pytest-cov==7.1.0" "hypothesis==6.165.7"

      - name: Produce the test evidence
        # Writes the step summary itself, through $GITHUB_STEP_SUMMARY, using the
        # same code path that writes nothing when the variable is unset. There is
        # no CI-only reporting logic here.
        run: python -m tools.quality evidence

      - name: Verify the evidence
        # `always()`, so a failing suite still has its evidence checked before it
        # is uploaded. This is NOT `continue-on-error`: the step's own failure
        # still fails the job. The two look alike and are opposites, and
        # `tests/contract/test_evidence_contract.py` pins the difference.
        if: always()
        run: python -m tools.quality.evidence verify

      - name: Upload the evidence
        # `always()` for the same reason, and it is the load-bearing one: a run
        # that failed is exactly when somebody needs the JUnit report and the
        # timings. Uploading them does not make the job pass — the steps above
        # have already decided that.
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-windows-py314
          # The nine evidence files and the browsable coverage tree beside them.
          # No caches and no virtual environment. The raw coverage database is
          # not here either: the gate deletes it once the reports are written,
          # because it is a binary store of absolute paths and every number in it
          # is already in coverage.json.
          path: .globin/evidence/
          # Explicit rather than inherited from the repository default, which a
          # setting nobody remembers could change under this workflow.
          retention-days: 30
          # A run that produced nothing has already failed above; saying so here
          # too turns a confusing empty artifact into a named error.
          if-no-files-found: error

  hygiene:
    name: Pre-commit hooks
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install pre-commit and the tools its local hook needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pre-commit==4.6.2" "pytest==9.0.3" "pytest-cov==7.1.0" "hypothesis==6.165.7"

      - name: Run every hook over every file
        # `--show-diff-on-failure` prints what an autofixing hook WOULD change.
        # The change is shown, never committed: the fix is the author's to make
        # and to look at.
        run: python -m pre_commit run --all-files --show-diff-on-failure

  attest:
    name: Provenance
    # NOT a check, and deliberately not in `required_jobs`. It publishes a claim
    # about an artifact that has already been judged; requiring it would make
    # every pull-request run fail for the absence of a job that pull requests
    # must not run.
    needs: supply
    # THE GUARD THAT MAKES THE PERMISSIONS BELOW SAFE. This job mints an OIDC
    # token and writes an attestation, which is the largest privilege anything in
    # this repository asks for. It runs only on a push to master — never on a
    # pull request, and therefore never on code an outside contributor wrote.
    # Since Phase 014 this repository is public, so that distinction stopped
    # being hypothetical (ADR-0046).
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      # Mints the OIDC token Sigstore exchanges for a signing certificate.
      # `docs/engineering/CI_SECURITY.md` refused this scope outright until now,
      # on the grounds that it "is a capability this repository should acquire by
      # decision rather than inherit". This is that decision, and it is confined
      # to one job behind the trigger guard above.
      id-token: write
      # Writes the attestation itself.
      attestations: write

    steps:
      - name: Download the supply-chain evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-chain-evidence
          path: supply-evidence

      - name: Attest the supply-chain evidence
        # Signs a statement that THIS workflow, at THIS commit, produced these
        # bytes. It says nothing about whether they are good — the `supply` job
        # already decided that, and this job would run either way. Provenance and
        # a verdict are different claims, and conflating them would let a signature
        # be read as an approval.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'supply-evidence/*.json'

  aggregate:
    # THE check to mark as required on `master`. Its displayed name is stable by
    # construction: no operating system, no interpreter version, no matrix value,
    # so a branch protection rule survives a change to any of them. The matrix
    # jobs cannot serve the purpose — they appear as `Quality (Python 3.12)` and
    # `Quality (Python 3.14)`, and adding an interpreter would leave the rule
    # naming a set that no longer describes the workflow.
    #
    # The name is declared in `[tool.globin.workflow]` too, and a contract test
    # compares the two, so renaming this job without updating the documentation
    # fails the suite rather than quietly detaching the rule from the check.
    name: Quality gate
    needs: [quality, mutation, shards, runtime, supply, evidence, hygiene]

    # `!cancelled()` rather than `always()`, and the difference is the point.
    #
    # Without any `if:`, GitHub SKIPS a job whose dependency failed — and a
    # skipped required check is not reported to branch protection as a failing
    # one. A rule requiring this check would then be satisfied by a run in which
    # every job it depends on had failed. That is the hole this job exists to
    # close, so it has to run precisely when something upstream did not.
    #
    # `always()` would also run it when the whole run was cancelled. The
    # concurrency rule above still cancels superseded runs everywhere except
    # master, so on a pull request or a merge-group entry `always()` would spend a
    # runner and post a confusing failing check on every run that a newer commit
    # had already made irrelevant. `!cancelled()` skips those and still runs after
    # a failure. A single job that was cancelled while the run was not still
    # reaches the aggregate, which reads it as unmeasured.
    #
    # On master nothing is cancelled, so this condition costs nothing there and
    # the evidence chain has no gaps to explain.
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    # The smallest amount of work in the file and deliberately not the smallest
    # budget: this job downloads an artifact, and a stalled download is exactly
    # the failure a timeout exists to bound. A required check that hangs blocks
    # the branch as effectively as one that fails, and says less about why.
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      # No `pip install`. This job starts no tool: it reads two files and some
      # environment variables. Every number it reports was measured by a job
      # above, and re-measuring here would be asking a second machine the same
      # question and believing whichever answer arrived last.

      - name: Download the evidence this run published
        # `!cancelled()` so that a failed evidence job still has its bundle
        # fetched — the upload step above runs on `always()`, so the artifact
        # exists even when the suite failed.
        #
        # If there is genuinely nothing to download this step fails, the job
        # fails, and the aggregate below still runs and records why. That is the
        # intended shape: the missing artifact is itself the finding.
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-evidence-windows-py314
          # Where the evidence gate writes and reads, so the verifier below needs
          # no argument and no second notion of where evidence lives.
          path: .globin/evidence

      - name: Verify the evidence that was published
        # The same verifier the evidence job already ran, against different
        # bytes: these have been through upload and download. It re-checks the
        # manifest's digest, every file's checksum, the count arithmetic and the
        # redaction rules, so a bundle corrupted or truncated in transit is
        # caught here rather than trusted because a job said it was fine.
        if: ${{ !cancelled() }}
        run: python -m tools.quality.evidence verify

      - name: Decide whether this run passed
        # The one place the verdict is made. It reads every job's result and the
        # evidence just verified, writes `aggregate-quality.json`, appends the
        # step summary, and exits non-zero unless every required job passed and
        # the evidence agreed. Locally the same command reads the evidence the
        # last local run wrote, so a developer and CI apply one evaluator.
        if: ${{ !cancelled() }}
        env:
          # Passed through the environment rather than as arguments: this is a
          # JSON document full of quotes and braces, and threading one through a
          # `run:` line intact on a Windows runner is a quoting problem with no
          # upside.
          GLOBIN_WORKFLOW_NEEDS: ${{ toJSON(needs) }}
          GLOBIN_WORKFLOW_ARTIFACT_DIGEST: ${{ needs.evidence.outputs.artifact-digest }}
        run: python -m tools.quality aggregate

      - name: Upload the aggregate verdict
        # Small, and separate from the evidence bundle on purpose: this document
        # records the digest of that bundle, so putting it inside would make the
        # bundle's digest depend on a value derived from the bundle.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-verdict
          path: .globin/workflow/
          retention-days: 30
          if-no-files-found: error
